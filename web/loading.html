<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>piCare 시스템 로딩</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      text-align: center;
      height: 100vh;
      width: 100vw;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }

    .container {
      width: 100%;
      padding: 20px;
    }

    .logo {
      font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(2.8em, 10vw, 4em);
      font-weight: 700;
      margin-bottom: 15px;
      letter-spacing: 3px;
      color: #00d9ff;
      text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
    }

    .subtitle {
      font-size: clamp(1em, 3.5vw, 1.2em);
      margin-bottom: 70px;
      color: #e0e0e0;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* HAL 9000 스타일 로딩 애니메이션 */
    .loading-spinner {
      width: clamp(90px, 20vw, 120px);
      height: clamp(90px, 20vw, 120px);
      margin: 50px auto;
      position: relative;
    }

    .hal-eye {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* 중앙 코어 */
    .hal-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 35%;
      height: 35%;
      background: radial-gradient(circle, #00d9ff 0%, #0088aa 100%);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
      box-shadow: 
        0 0 20px rgba(0, 217, 255, 0.6),
        0 0 40px rgba(0, 217, 255, 0.4),
        inset 0 0 20px rgba(0, 217, 255, 0.3);
    }

    /* 외곽 링 - 3개 */
    .hal-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(0, 217, 255, 0.3);
    }

    .hal-ring:nth-child(1) {
      width: 60%;
      height: 60%;
      animation: ringPulse 1.5s ease-in-out infinite;
    }

    .hal-ring:nth-child(2) {
      width: 80%;
      height: 80%;
      animation: ringPulse 1.5s ease-in-out 0.2s infinite;
    }

    .hal-ring:nth-child(3) {
      width: 100%;
      height: 100%;
      animation: ringPulse 1.5s ease-in-out 0.4s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
        box-shadow: 
          0 0 20px rgba(0, 217, 255, 0.6),
          0 0 40px rgba(0, 217, 255, 0.4),
          inset 0 0 20px rgba(0, 217, 255, 0.3);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 0.9;
        box-shadow: 
          0 0 30px rgba(0, 217, 255, 0.8),
          0 0 60px rgba(0, 217, 255, 0.6),
          inset 0 0 30px rgba(0, 217, 255, 0.5);
      }
    }

    @keyframes ringPulse {
      0%, 100% {
        opacity: 0.3;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    .status {
      font-size: clamp(1.3em, 4.5vw, 1.6em);
      margin: 50px 0 15px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .status-detail {
      font-size: clamp(0.95em, 3.2vw, 1.05em);
      color: #b0b0b0;
      font-weight: 300;
    }

    /* 로딩 점 애니메이션 */
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    .debug-info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      font-family: 'Comfortaa', 'SF Mono', 'Courier New', monospace;
      font-size: 0.8em;
      opacity: 0.5;
      line-height: 1.6;
      color: #808080;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="logo">piCore</div>
    <div class="subtitle">MCR-1A edition</div>

    <div class="loading-spinner">
      <div class="hal-eye">
        <div class="hal-ring"></div>
        <div class="hal-ring"></div>
        <div class="hal-ring"></div>
        <div class="hal-core"></div>
      </div>
    </div>

    <div class="status">
      Initializing<span class="loading-dots"></span>
    </div>
    <div class="status-detail">
      Powered by Intel
    </div>
  </div>

  <div class="debug-info" id="debugInfo">
    IP: 확인 중...
  </div>

  <script>
    fetch('/ip')
      .then(r => r.json())
      .then(d => {
        const debugInfo = document.getElementById('debugInfo');
        
        // 디버깅 정보 업데이트
        let info = '';
        if (d.ip) {
          info += `IP: ${d.ip}`;
        }
        if (d.url) {
          info += ` | URL: ${d.url}`;
        }
        
        if (info) {
          debugInfo.textContent = info;
        }
      })
      .catch(() => {
        document.getElementById('debugInfo').textContent = 'IP: 조회 실패';
      })
  </script>
</body>
</html>
