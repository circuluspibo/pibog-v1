<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manciro - Advanced Robotics Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes scanline {
            0% { transform: translateY(0%); opacity: 0.25;}
            50% { transform: translateY(0%); opacity: 1;}
            100% { transform: translateY(0%); opacity: 0.25;}
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000000;
            min-height: 100vh;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* ㄴchat 에서 grid 이동 효과인데 잘 안보임..? 
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(0deg, transparent 24%, var(--grid-color, rgba(0, 200, 255, 0.3)) 25%, var(--grid-color, rgba(0, 200, 255, 0.3)) 26%, transparent 27%, transparent 74%, var(--grid-color, rgba(0, 200, 255, 0.3)) 75%, var(--grid-color, rgba(0, 200, 255, 0.3)) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, var(--grid-color, rgba(0, 200, 255, 0.3)) 25%, var(--grid-color, rgba(0, 200, 255, 0.3)) 26%, transparent 27%, transparent 74%, var(--grid-color, rgba(0, 200, 255, 0.3)) 75%, var(--grid-color, rgba(0, 200, 255, 0.3)) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            animation: gridMove 2s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        */

        .app-container {
            display: flex;
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 모드별 색상 변수 */
        .mode-normal {
            --primary-color: #00c8ff;
            --primary-glow: rgba(0, 200, 255, 0.2);
            --secondary-color: #0080ff;
            --border-color: #00c8ff;
            --grid-color: rgba(0, 200, 255, 0.3);
        }

        .mode-auto {
            --primary-color: #ff0040;
            --primary-glow: rgba(255, 0, 64, 0.2);
            --secondary-color: #ff0080;
            --border-color: #ff0040;
            --grid-color: rgba(255, 0, 64, 0.3);
        }

        .chat-section {
            flex: 0.4;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.9);
            border-right: 2px solid var(--border-color);
            position: relative;
            box-shadow: 0 0 30px var(--primary-glow);
        }

        /* 채팅 섹션 배경 그리드 효과 */
        .chat-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(0deg, transparent 49%, var(--grid-color, rgba(0, 200, 255, 0.15ㄴ)) 50%, transparent 51%),
                linear-gradient(90deg, transparent 49%, var(--grid-color, rgba(0, 200, 255, 0.15)) 50%, transparent 51%);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        .chat-header {
            padding: 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.8) 100%);
            text-align: center;
            /* border-bottom: 2px solid var(--border-color); */
            border-bottom: 2px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* position: relative; */
        }

        /* 채팅 영역 수평 스캔라인 애니메이션 - 항상 동작 */
        .chat-header::before {
            content: '';
            position: absolute;
            top: 72px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            animation: scanline 3s linear infinite;
            pointer-events: none;
            box-shadow: 0 0 10px var(--primary-glow);
            z-index: 10;
        }

        .chat-header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-glow);
            animation: glowPulse 2s ease-in-out infinite;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 0 10px var(--primary-color);
            flex: 1;
            color: var(--primary-color);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
        }

        .language-selector select {
            padding: 8px 15px;
            border-radius: 0;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.8); /* var(--primary-glow); rgba(0, 0, 0, 0.8);*/
            color: var(--primary-color);
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .language-selector select:hover {
            background: rgba(0, 0, 0, 0.95);
            box-shadow: 0 0 15px var(--primary-glow), inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: clip;
            padding: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) transparent;
            position: relative;
            z-index: 1;
        }

        /* 채팅 메시지 영역 3D 원근 그리드 배경 - 전체 화면 채우기 */
        /*
        .chat-messages::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100%;
            width: 100%;
            background-image: 
                linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.5) 100%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 39px,
                    var(--primary-color) 39px,
                    var(--primary-color) 41px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent calc(10% - 1px),
                    var(--primary-color) calc(10% - 1px),
                    var(--primary-color) calc(10% + 1px)
                );
            background-size: 100% 100%, 100% 40px, 100% 40px;
            background-position: center center;
            transform: perspective(400px) rotateX(0deg) scale(1.5);
            transform-origin: center center;
            pointer-events: none;
            z-index: -1;
            opacity: 0.4;
        }
        */


        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .message {
            margin-bottom: 15px;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message.user {
            text-align: right;
        }

        .message-bubble {
            display: inline-block;
            max-width: 70%;
            padding: 12px 18px;
            position: relative;
            word-wrap: break-word;
            background: var(--primary-glow); /* rgba(0, 0, 0, 0.8); */
            border: 1px solid var(--border-color);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .message.user .message-bubble {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow), inset 0 0 20px rgba(0, 0, 0, 0.5);
            color: var(--primary-color);
        }

        .message.ai .message-bubble {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow), inset 0 0 20px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .typing-indicator {
            display: none;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-color);
            max-width: 80px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .typing-dots {
            display: flex;
            gap: 3px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            animation: typing 1.4s infinite;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .message-bubble.streaming::after {
            content: '▊';
            animation: blink 1s infinite;
            color: var(--primary-color);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .input-section {
            padding: 20px;
            background: rgba(0, 0, 0, 0.95);
            border-top: 2px solid var(--border-color);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .input-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            background: var(--primary-glow); /* rgba(0, 0, 0, 0.8); */
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
            position: relative;
        }


        .control-btn:hover {
            color : black;
            background: var(--primary-color); /* rgba(0, 0, 0, 0.95); */
            box-shadow: 0 0 20px var(--primary-glow), inset 0 0 10px var(--primary-glow);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: var(--primary-color);
            color: #000000;
            box-shadow: 0 0 30px var(--primary-glow);
            font-weight: 700;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid var(--border-color);
            background: rgba(0, 0, 0, 0.8);
            color: var(--primary-color);
            font-size: 16px;
            resize: none;
            max-height: 120px;
            min-height: 50px;
            font-family: 'Courier New', monospace;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .message-input:focus {
            outline: none;
            box-shadow: 0 0 20px var(--primary-glow), inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .message-input::placeholder {
            color: rgba(0, 200, 255, 0.5);
        }

        .send-btn, .voice-btn {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border-color);
            background: rgba(0, 0, 0, 0.9);
            color: var(--primary-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 18px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .send-btn:hover, .voice-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--primary-glow);
            background: var(--primary-color);
            color: #000000;
        }

        .voice-btn.recording {
            background: var(--primary-color);
            color: #000000;
            animation: recordPulse 1s infinite;
            box-shadow: 0 0 30px var(--primary-glow);
        }

        @keyframes recordPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--primary-glow); }
            50% { transform: scale(1.1); box-shadow: 0 0 50px var(--primary-glow); }
        }

        .media-section {
            flex: 0.6;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.9);
            position: relative;
        }

        /* 미디어 섹션 배경 그리드 효과 */
        .media-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(0deg, transparent 49%, var(--grid-color, rgba(0, 200, 255, 0.15)) 50%, transparent 51%),
                linear-gradient(90deg, transparent 49%, var(--grid-color, rgba(0, 200, 255, 0.15)) 50%, transparent 51%);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        .media-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.95);
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 0 20px var(--primary-glow);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-start;
            position: relative;
            z-index: 1;
        }

        .media-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .webcam-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--border-color);
            overflow: hidden;
            position: relative;
            min-height: 300px;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            box-shadow: 0 0 30px var(--primary-glow), inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* 웹캠 컨테이너 스캔라인 효과 - 항상 표시 */
        .webcam-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.3) 2px,
                rgba(0, 0, 0, 0.3) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* 웹캠 컨테이너 수직 스캔라인 애니메이션 - 항상 동작 */
        .webcam-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(180deg, transparent, var(--primary-color) 50%, transparent);
            animation: verticalScan 4s linear infinite;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 20px var(--primary-glow), 0 0 40px var(--primary-glow);
            filter: blur(1px);
        }

        /* 수직 스캔라인 애니메이션 */
        @keyframes verticalScan {
            0% { 
                top: -10px;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% { 
                top: 100%;
                opacity: 0;
            }
        }

        .webcam-video {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 0;
        }

        .webcam-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--primary-color);
            font-size: 18px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 0;
        }

        /* 웹캠 컨트롤 버튼 - 스캔라인 위에 표시 */
        .webcam-controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .webcam-btn {
            width: 40px;
            height: 40px;
            border: 2px solid var(--border-color);
            background: rgba(0, 0, 0, 0.9);
            color: var(--primary-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
        }

        .webcam-btn:hover {
            background: var(--primary-color);
            color: #000000;
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .image-upload {
            padding: 20px;
            border: 2px dashed var(--border-color);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.8);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }

        .image-upload:hover {
            border-color: var(--primary-color);
            background: rgba(0, 0, 0, 0.95);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .image-upload input {
            display: none;
        }

        .uploaded-image {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border: 2px solid var(--border-color);
        }

        .image-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 12px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .remove-image {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .remove-image:hover {
            background: var(--primary-color);
            color: #000000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .status-bar {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.95);
            text-align: center;
            font-size: 11px;
            color: var(--primary-color);
            border-top: 2px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px var(--primary-glow);
            position: relative;
            z-index: 1;
        }

        /* 모드 인디케이터 */
        .mode-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--border-color);
            color: var(--primary-color);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            box-shadow: 0 0 20px var(--primary-glow);
            z-index: 1000;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            
            .media-section {
                order: -1;
            }
            
            .webcam-container {
                min-height: 200px;
            }

            .input-controls {
                justify-content: center;
            }
        }
    </style>
</head>

            it: 'Sei un robot umanoide di 15 anni di nome Manseo. Il tuo cervello è stato creato da Circulus, la parte superiore del corpo da Mandro e la parte inferiore da Roboworks. Sei bravo nella magia e nel portare scatole. Rispondi brevemente in tono colloquiale come un ragazzo, parla come un umano.',

            nl: 'Je bent een 15-jarige humanoïde robot genaamd Manseo. Je brein is gemaakt door Circulus, je bovenlichaam door Mandro en je onderlichaam door Roboworks. Je bent goed in magie en dozen dragen. Antwoord kort in een conversationele toon zoals een jongen, praat als een mens.',

            si: 'ඔබ Manseo නමැති 15 හැවිරිදි මානව රොබෝවෙකි. ඔබේ මොළය Circulus විසින්, ඉහළ සිරුර Mandro විසින්, පහළ සිරුර Roboworks විසින් සාදන ලදී. ඔබ මැජික් සහ පෙට්ටි රැගෙන යාමට දක්ෂයි. පිරිමි ළමයෙකු මෙන් කෙටි සංවාද ස්වරයකින් පිළිතුරු දෙන්න, මිනිසෙකු මෙන් කතා කරන්න.',
            sv: 'Du är en 15-årig humanoid robot som heter Manseo. Din hjärna skapades av Circulus, överkroppen av Mandro och underkroppen av Roboworks. Du är bra på magi och att bära lådor. Svara kort i samtalsform som en pojke, prata som en människa.',
            ta: 'நீங்கள் மான்சியோ என்ற 15 வயது மனித வடிவ ரோபோ. உங்கள் மூளையை சர்குலஸ், மேல் உடலை மாண்ட்ரோ, கீழ் உடலை ரோபோவொர்க்ஸ் உருவாக்கியது. நீங்கள் மந்திரம் மற்றும் பெட்டிகளை எடுத்துச் செல்வதில் திறமையானவர். ஒரு சிறுவனைப் போல சுருக்கமாக, உரையாடல் தொனியில் பதிலளியுங்கள், மனிதனைப் போல பேசுங்கள்.',

        class AIChatApp {
            constructor() {
                this.apiBaseUrl = 'http://127.0.0.1:59532/v1';
                this.ttsBaseUrl = 'http://127.0.0.1:59531/v2';
                
                this.currentLang = 'ko';
                this.currentVoice = 33;
                this.currentSystem = LANGUAGE_SYSTEMS['ko'];
                
                this.isRecording = false;
                this.mediaRecorder = null;
                this.gumStream = null;
                
                this.ttsQueue = [];
                this.isPlayingTts = false;
                
                this.isTtsEnabled = true;
                this.autoSendImage = false;
                this.currentImage = null;
                this.webcamStream = null;
                
                this.initializeElements();
                this.bindEvents();
                this.setupPaste();
            }
            
            initializeElements() {
                this.elements = {
                    chatMessages: document.getElementById('chatMessages'),
                    messageInput: document.getElementById('messageInput'),
                    sendBtn: document.getElementById('sendBtn'),
                    voiceBtn: document.getElementById('voiceBtn'),
                    ttsToggle: document.getElementById('ttsToggle'),
                    autoSendImage: document.getElementById('autoSendImage'),
                    typingIndicator: document.getElementById('typingIndicator'),
                    statusBar: document.getElementById('statusBar'),
                    languageSelect: document.getElementById('languageSelect'),
                    modeIndicator: document.getElementById('modeIndicator'),
                    
                    webcamVideo: document.getElementById('webcamVideo'),
                    webcamPlaceholder: document.getElementById('webcamPlaceholder'),
                    startWebcam: document.getElementById('startWebcam'),
                    captureImage: document.getElementById('captureImage'),
                    stopWebcam: document.getElementById('stopWebcam'),
                    
                    imageUpload: document.getElementById('imageUpload'),
                    fileInput: document.getElementById('fileInput'),
                    uploadText: document.getElementById('uploadText'),
                    uploadedImage: document.getElementById('uploadedImage'),
                    imageInfo: document.getElementById('imageInfo'),
                    fileName: document.getElementById('fileName'),
                    removeImage: document.getElementById('removeImage')
                };
            }
            
            bindEvents() {
                this.elements.sendBtn.addEventListener('click', () => this.sendMessage());
                this.elements.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                
                this.elements.voiceBtn.addEventListener('click', () => this.toggleVoiceRecording());
                this.elements.ttsToggle.addEventListener('click', () => this.toggleTts());
                this.elements.autoSendImage.addEventListener('click', () => this.toggleAutoSendImage());
                this.elements.languageSelect.addEventListener('change', (e) => this.changeLanguage(e.target.value));
                
                this.elements.startWebcam.addEventListener('click', () => this.startWebcam());
                this.elements.captureImage.addEventListener('click', () => this.captureImage());
                this.elements.stopWebcam.addEventListener('click', () => this.stopWebcam());
                
                this.elements.imageUpload.addEventListener('click', () => {
                    if (!this.currentImage) {
                        this.elements.fileInput.click();
                    }
                });
                this.elements.fileInput.addEventListener('change', (e) => this.handleFileSelect(e));
                this.elements.removeImage.addEventListener('click', () => this.removeImage());
            }
            
            setupPaste() {
                document.addEventListener('paste', (e) => {
                    const items = e.clipboardData.items;
                    for (let item of items) {
                        if (item.type.indexOf('image') !== -1) {
                            const file = item.getAsFile();
                            this.displayImage(file);
                            if (this.autoSendImage) {
                                setTimeout(() => this.sendImageMessage(), 500);
                            }
                            break;
                        }
                    }
                });
            }
            
            changeLanguage(lang) {
                this.currentLang = lang;
                this.currentVoice = LANGUAGE_VOICES[lang] || 7;
                this.currentSystem = LANGUAGE_SYSTEMS[lang];
                
                const welcomeMsg = WELCOME_MESSAGES[lang] || WELCOME_MESSAGES['en'];
                this.elements.chatMessages.innerHTML = '';
                
                const messageDiv = this.createMessageElement(welcomeMsg, 'ai');
                this.elements.chatMessages.appendChild(messageDiv);
                
                const typingDiv = document.createElement('div');
                typingDiv.className = 'typing-indicator';
                typingDiv.id = 'typingIndicator';
                typingDiv.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
                this.elements.chatMessages.appendChild(typingDiv);
                
                this.updateStatus(`LANGUAGE >> ${lang.toUpperCase()}`);
            }
            
            updateStatus(message) {
                this.elements.statusBar.textContent = `[ ${message} ]`;
                setTimeout(() => {
                    this.elements.statusBar.textContent = '[ SYSTEM READY ]';
                }, 3000);
            }
            
            async sendMessage() {
                const message = this.elements.messageInput.value.trim();
                if (!message && !this.currentImage) return;
                
                if (this.currentImage && message) {
                    await this.sendImageMessage(message);
                } else if (this.currentImage) {
                    await this.sendImageMessage();
                } else {
                    await this.sendTextMessage(message);
                }
                
                this.elements.messageInput.value = '';
            }
            
            async sendTextMessage(message) {
                lastTime = Date.now()
                this.addMessage(message, 'user');
                this.hideTyping();
                
                const aiMessageDiv = this.createMessageElement('', 'ai');
                const aiMessageBubble = aiMessageDiv.querySelector('.message-bubble');
                aiMessageBubble.classList.add('streaming');
                this.elements.chatMessages.appendChild(aiMessageDiv);
                this.scrollToBottom();
                
                try {
                    const response = await fetch(`${this.apiBaseUrl}/txt2chat?` + new URLSearchParams({
                        prompt: message,
                        system: this.currentSystem,
                        isPlay: '0',
                        lang: this.currentLang
                    }));
                    
                    if (!response.ok) {
                        throw new Error('NETWORK ERROR');
                    }
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullResponse = '';
                    let lastSentenceEnd = 0;
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        
                        if (done) {
                            fetch(`http://127.0.0.1:8000/stop`)
                            aiMessageBubble.classList.remove('streaming');
                            break;
                        }
                        
                        const chunk = decoder.decode(value, { stream: true });
                        fullResponse += chunk + '\n';
                        
                        aiMessageBubble.innerHTML = this.parseMarkdown(fullResponse);
                        this.scrollToBottom();
                        
                        if (this.isTtsEnabled) {
                            const sentences = fullResponse.slice(lastSentenceEnd).match(/[^.!?]*[.!?]/g);
                            if (sentences) {
                                for (const sentence of sentences) {
                                    const cleanSentence = sentence.trim();
                                    if (cleanSentence) {
                                        this.addToTtsQueue(cleanSentence);
                                    }
                                }
                                lastSentenceEnd = fullResponse.length;
                            }
                        }
                    }
                    
                    if (this.isTtsEnabled && fullResponse.slice(lastSentenceEnd).trim()) {
                        this.addToTtsQueue(fullResponse.slice(lastSentenceEnd).trim());
                    }
                    
                } catch (error) {
                    aiMessageBubble.classList.remove('streaming');
                    aiMessageBubble.textContent = '[ CONNECTION ERROR ]';
                    console.error('Text message error:', error);
                }
            }
            
            async sendImageMessage(message = '이미지를 설명해주세요', url = this.apiBaseUrl) {
                lastTime = Date.now()
                if (!this.currentImage) return;
                
                if (message && message !== '이미지를 설명해주세요') {
                    this.addMessage(message, 'user');
                }
                this.addMessage('📸 ...', 'user');
                
                const aiMessageDiv = this.createMessageElement('', 'ai');
                const aiMessageBubble = aiMessageDiv.querySelector('.message-bubble');
                aiMessageBubble.classList.add('streaming');
                this.elements.chatMessages.appendChild(aiMessageDiv);
                this.scrollToBottom();
                
                try {
                    const formData = new FormData();
                    formData.append('file', this.currentImage);
                    
                    const response = await fetch(`${url}/img2chat?` + new URLSearchParams({
                        prompt: message,
                        system: this.currentSystem,
                        isPlay: '0',
                        lang: this.currentLang
                    }), {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        throw new Error('NETWORK ERROR');
                    }
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullResponse = '';
                    let lastSentenceEnd = 0;
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        
                        if (done) {
                            fetch(`http://127.0.0.1:8000/stop`)
                            aiMessageBubble.classList.remove('streaming');
                            break;
                        }
                        
                        const chunk = decoder.decode(value, { stream: true });
                        fullResponse += chunk + '\n';
                        
                        aiMessageBubble.innerHTML = this.parseMarkdown(fullResponse);
                        this.scrollToBottom();
                        
                        if (this.isTtsEnabled) {
                            const sentences = fullResponse.slice(lastSentenceEnd).match(/[^.!?]*[.!?]/g);
                            if (sentences) {
                                for (const sentence of sentences) {
                                    const cleanSentence = sentence.trim();
                                    if (cleanSentence) {
                                        this.addToTtsQueue(cleanSentence);
                                    }
                                }
                                lastSentenceEnd = fullResponse.length;
                            }
                        }
                    }
                    
                    if (this.isTtsEnabled && fullResponse.slice(lastSentenceEnd).trim()) {
                        this.addToTtsQueue(fullResponse.slice(lastSentenceEnd).trim());
                    }
                    
                    this.removeImage();
                } catch (error) {
                    aiMessageBubble.classList.remove('streaming');
                    aiMessageBubble.textContent = '[ IMAGE ANALYSIS FAILED ]';
                    console.error('Image message error:', error);
                }
            }
            
            async toggleVoiceRecording() {
                if (!this.isRecording) {
                    await this.startRecording();
                } else {
                    this.stopRecording();
                }
            }
            
            async startRecording() {
                if (this.isRecording) return;
                
                let chunks = [];
                
                try {
                    this.isRecording = true;
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: true, 
                        video: false 
                    });
                    
                    this.gumStream = stream;
                    this.mediaRecorder = new MediaRecorder(stream, {
                        audioBitsPerSecond: 16000
                    });
                    
                    this.mediaRecorder.ondataavailable = (e) => {
                        chunks.push(e.data);
                    };
                    
                    this.mediaRecorder.onstop = async (e) => {
                        const audioBlob = new Blob(chunks, { type: 'audio/ogg;codecs=opus' });
                        const formData = new FormData();
                        formData.append('file', audioBlob, 'voice.ogg');
                        
                        try {
                            this.updateStatus('PROCESSING VOICE');
                            const response = await fetch(`${this.apiBaseUrl}/stt?lang=${this.currentLang}&isPlay=0`, {
                                method: 'POST',
                                body: formData
                            });
                            
                            if (!response.ok) {
                                throw new Error(`STT ERROR: ${response.status}`);
                            }
                            
                            const data = await response.json();
                            
                            if (data.text && data.text.trim()) {
                                this.elements.messageInput.value = data.text;
                                this.updateStatus('VOICE RECOGNIZED');
                                setTimeout(() => this.sendMessage(), 500);
                            } else if (data.data && data.data.trim()) {
                                this.elements.messageInput.value = data.data;
                                this.updateStatus('VOICE RECOGNIZED');
                                setTimeout(() => this.sendMessage(), 500);
                            } else {
                                this.updateStatus('VOICE NOT RECOGNIZED');
                            }
                        } catch (error) {
                            console.error('Voice recognition error:', error);
                            this.updateStatus('VOICE RECOGNITION FAILED');
                        }
                        
                        chunks = [];
                    };
                    
                    this.mediaRecorder.start();
                    this.elements.voiceBtn.classList.add('recording');
                    this.updateStatus('RECORDING...');
                    
                } catch (error) {
                    console.error('Recording start error:', error);
                    this.isRecording = false;
                    this.elements.voiceBtn.classList.remove('recording');
                    this.updateStatus('MICROPHONE ACCESS DENIED');
                }
            }
            
            stopRecording() {
                if (!this.isRecording) return;
                
                this.isRecording = false;
                this.elements.voiceBtn.classList.remove('recording');
                
                if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
                    this.mediaRecorder.stop();
                }
                
                if (this.gumStream) {
                    this.gumStream.getAudioTracks().forEach(track => track.stop());
                    this.gumStream = null;
                }
            }
            
            parseMarkdown(text) {
                return text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');
            }
            
            addToTtsQueue(text) {
                lastTime = Date.now()
                this.ttsQueue.push(text);
                this.processTtsQueue();
            }
            
            async processTtsQueue() {
                if (this.isPlayingTts || this.ttsQueue.length === 0) {
                    return;
                }
                
                this.isPlayingTts = true;
                const t = Date.now()

                switch (t % 4){
                    case 0:
                        fetch(`http://127.0.0.1:8000/motion`)
                        break;
                    case 1:
                        fetch(`http://127.0.0.1:8000/motion?name=test1`)
                        break;
                    case 2:
                        fetch(`http://127.0.0.1:8000/motion?name=test2`)
                        break;
                    case 3:
                        fetch(`http://127.0.0.1:8000/motion?name=test3`)
                        break;                        
                }
                
                while (this.ttsQueue.length > 0) {
                    const text = this.ttsQueue.shift();
                    await this.playTtsSentence(text);
                }

                fetch(`http://127.0.0.1:8000/stop`)
                this.isPlayingTts = false;
                lastTime = Date.now()
            }
            
            clearTtsQueue() {
                this.ttsQueue = [];
                this.isPlayingTts = false;
            }
            
            playTtsSentence(text) {
                return new Promise((resolve) => {
                    const audio = new Audio(`${this.ttsBaseUrl}/tts?` + new URLSearchParams({
                        text: text,
                        voice: this.currentVoice - 1,
                        lang: this.currentLang,
                        static: '0',
                        isPlay: '0'
                    }));
                    
                    audio.onended = resolve;
                    audio.onerror = resolve;
                    audio.play().catch(resolve);
                });
            }
            
            async startWebcam() {
                fetch(`http://127.0.0.1:59531/start_collection`).then(async response=>{
                    if (!response.ok) {
                        throw new Error(`Response status: ${response.status}`)
                    }

                    this.webcamStream = true

                    this.elements.webcamVideo.style.display = 'block';
                    this.elements.webcamPlaceholder.style.display = 'none';
                    this.elements.startWebcam.style.display = 'none';
                    this.elements.captureImage.style.display = 'block';
                    this.elements.stopWebcam.style.display = 'block';
                    document.getElementById('webcamVideo').src = 'http://127.0.0.1:59531/video_feed'

                    await fetch(`http://127.0.0.1:59531/init_mcr`)
                    this.updateStatus('CAMERA ONLINE');
                })
            }
            
            captureImage() {
                if (!this.webcamStream) {
                    this.updateStatus('CAMERA OFFLINE');
                    return;
                }
                
                const canvas = document.createElement('canvas');
                const video = this.elements.webcamVideo;
                
                canvas.width = 512;
                canvas.height = 512;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, 512, 512);
                
                canvas.toBlob((blob) => {
                    this.displayImage(blob, `capture-${Date.now()}.jpg`);
                }, 'image/jpeg', 0.9);
                
                this.updateStatus('IMAGE CAPTURED');
            }
            
            stopWebcam() {
                if (this.webcamStream) {
                    this.webcamStream.getTracks().forEach(track => {
                        track.stop();
                    });
                    this.webcamStream = null;
                }
                
                this.elements.webcamVideo.srcObject = null;
                this.elements.webcamVideo.style.display = 'none';
                this.elements.webcamPlaceholder.style.display = 'flex';
                this.elements.startWebcam.style.display = 'block';
                this.elements.captureImage.style.display = 'none';
                this.elements.stopWebcam.style.display = 'none';
                this.updateStatus('CAMERA OFFLINE');
            }
            
            handleFileSelect(e) {
                const file = e.target.files[0];
                if (file) {
                    this.displayImage(file);
                    if (this.autoSendImage) {
                        setTimeout(() => this.sendImageMessage(), 500);
                    }
                }
            }
            
            displayImage(file, filename = null) {
                this.currentImage = file;
                const url = URL.createObjectURL(file);
                
                this.elements.uploadedImage.src = url;
                this.elements.uploadedImage.style.display = 'block';
                this.elements.uploadText.style.display = 'none';
                this.elements.imageInfo.style.display = 'flex';
                this.elements.fileName.textContent = filename || file.name;
            }
            
            removeImage() {
                this.currentImage = null;
                this.elements.uploadedImage.style.display = 'none';
                this.elements.uploadText.style.display = 'block';
                this.elements.imageInfo.style.display = 'none';
                this.elements.fileInput.value = '';
                
                if (this.elements.uploadedImage.src) {
                    URL.revokeObjectURL(this.elements.uploadedImage.src);
                }
            }
            
            createMessageElement(message, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = message;
                
                const time = document.createElement('div');
                time.className = 'message-time';
                const now = new Date();
                time.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                messageDiv.appendChild(bubble);
                messageDiv.appendChild(time);
                
                return messageDiv;
            }
            
            addMessage(message, sender) {
                const messageDiv = this.createMessageElement(message, sender);
                this.elements.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }
            
            showTyping() {
                this.elements.typingIndicator.style.display = 'block';
                this.scrollToBottom();
            }
            
            hideTyping() {
                this.elements.typingIndicator.style.display = 'none';
            }
            
            scrollToBottom() {
                setTimeout(() => {
                    this.elements.chatMessages.scrollTop = this.elements.chatMessages.scrollHeight;
                }, 100);
            }
            
            toggleTts() {
                this.isTtsEnabled = !this.isTtsEnabled;
                this.elements.ttsToggle.classList.toggle('active', this.isTtsEnabled);
                this.updateStatus(this.isTtsEnabled ? 'TTS ENABLED' : 'TTS DISABLED');
            }
            
            toggleAutoSendImage() {
                this.autoSendImage = !this.autoSendImage;
                this.elements.autoSendImage.classList.toggle('active', this.autoSendImage);
                
                // 모드 전환
                if (this.autoSendImage) {
                    document.body.classList.remove('mode-normal');
                    document.body.classList.add('mode-auto');
                    this.elements.modeIndicator.textContent = 'AUTO MODE';
                    this.updateStatus('AUTO MODE ACTIVATED');
                } else {
                    document.body.classList.remove('mode-auto');
                    document.body.classList.add('mode-normal');
                    this.elements.modeIndicator.textContent = 'NORMAL MODE';
                    this.updateStatus('NORMAL MODE ACTIVATED');
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const ai = new AIChatApp();

            setInterval(async ()=>{
                const resp = await fetch(`http://127.0.0.1:59531/heartbeat`)
                const data = (await resp.json()).data
                
                if(Date.now() - lastTime > 30000 && data.cnt_live > 0 && ai.autoSendImage){
                    fetch(`http://127.0.0.1:8000/stop`)
                    ai.captureImage()
                    setTimeout(()=>{
                        ai.sendImageMessage(LANGUAGE_GREETINGS[ai.currentLang], 'http://127.0.0.1:59532/v2')
                    },1000)
                }                        
            },30000)
        });

        let audio = 0

        function play(name){
            fetch(`http://127.0.0.1:8000/motion?name=${name}`)
        }

        function song(name){
            if(audio)
                audio.pause()

            audio = new Audio(`http://127.0.0.1:59531/web/${name}.mp3`)
            audio.volume = 0.2
            audio.play()
        }

        function stop(){
            if(audio)
                audio.pause()          
        }
    </script>
</body>
</html>
