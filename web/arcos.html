<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCos - Advanced Robotics Interface</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        :root {
            --pc: #00c8ff;
            --pg: rgba(0,200,255,0.15);
            --sc: #0080ff;
            --bc: #00c8ff;
            --gc: rgba(0,200,255,0.22);
        }
        .mode-auto {
            --pc:#ff0040; --pg:rgba(255,0,64,0.15);
            --sc:#ff0080; --bc:#ff0040; --gc:rgba(255,0,64,0.22);
        }

        @keyframes glowPulse  { 0%,100%{opacity:.55} 50%{opacity:1} }
        @keyframes scanV      { 0%{top:-6px;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:100%;opacity:0} }
        @keyframes gridMove   { 0%{transform:translateY(0)} 100%{transform:translateY(40px)} }
        @keyframes blink      { 0%,50%{opacity:1} 51%,100%{opacity:0} }
        @keyframes msgIn      { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        @keyframes recPulse   { 0%,100%{box-shadow:0 0 16px var(--pg)} 50%{box-shadow:0 0 36px var(--pg)} }
        @keyframes typingDot  { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-6px);opacity:1} }
        @keyframes hexPulse   { 0%,100%{opacity:.1;transform:scale(1)} 50%{opacity:.28;transform:scale(1.04)} }
        @keyframes soundBar   { 0%,100%{transform:scaleY(.35)} 50%{transform:scaleY(1)} }
        @keyframes btnPress   { 0%{transform:scale(1)} 50%{transform:scale(.93)} 100%{transform:scale(1)} }

        html, body {
            width:100%; height:100%; overflow:hidden;
            font-family:'Courier New',monospace;
            background:#000; color:#fff;
            touch-action:manipulation;
        }

        /* ── BG ── */
        .bg-grid {
            position:fixed; inset:0; z-index:0; pointer-events:none;
            background-image:
                linear-gradient(0deg,transparent 49%,var(--gc) 50%,transparent 51%),
                linear-gradient(90deg,transparent 49%,var(--gc) 50%,transparent 51%);
            background-size:40px 40px;
            animation:gridMove 10s linear infinite; opacity:.35;
        }
        .hex-deco { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
        .hex {
            position:absolute; border:1px solid var(--pc);
            clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
            animation:hexPulse 5s ease-in-out infinite;
        }
        .hex:nth-child(1){width:80px;height:80px;top:4%;left:2%;animation-delay:0s}
        .hex:nth-child(2){width:48px;height:48px;top:72%;left:0%;animation-delay:1.2s}
        .hex:nth-child(3){width:62px;height:62px;top:18%;right:1%;animation-delay:2.4s}
        .hex:nth-child(4){width:76px;height:76px;bottom:4%;right:3%;animation-delay:.6s}

        /* ── LAYOUT ── */
        .app {
            position:relative; z-index:1;
            display:grid;
            grid-template-columns:300px 1fr;
            width:100vw; height:100vh;
        }

        /* ════════════════════════
           LEFT — CHAT PANEL
        ════════════════════════ */
        .chat-panel {
            display:flex; flex-direction:column;
            border-right:2px solid var(--bc);
            background:rgba(0,0,0,.93);
            box-shadow:4px 0 28px var(--pg);
            min-height:0; overflow:hidden; position:relative;
        }

        /* Header */
        .chat-header {
            height:50px; flex-shrink:0;
            display:flex; align-items:center; justify-content:space-between;
            padding:0 14px;
            background:rgba(0,0,0,.98);
            border-bottom:1px solid var(--bc);
            position:relative;
        }
        .chat-header::after {
            content:''; position:absolute; bottom:-2px; left:0; right:0; height:2px;
            background:linear-gradient(90deg,transparent,var(--pc),transparent);
            animation:glowPulse 2.5s ease-in-out infinite;
        }
        .logo      { font-size:17px; font-weight:700; letter-spacing:3px; color:var(--pc); text-shadow:0 0 10px var(--pc); }
        .logo-sub  { font-size:8px; letter-spacing:2px; color:var(--pc); opacity:.5; margin-top:1px; }

        .lang-sel select {
            padding:5px 7px; background:rgba(0,0,0,.9);
            border:1px solid var(--bc); color:var(--pc);
            font-family:'Courier New',monospace; font-size:12px;
            cursor:pointer; outline:none;
            clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
        }

        /* Messages */
        .chat-msgs {
            flex:1; min-height:0;
            overflow-y:auto; overflow-x:hidden;
            padding:12px;
            scrollbar-width:thin; scrollbar-color:var(--pc) transparent;
        }
        .chat-msgs::-webkit-scrollbar { width:3px; }
        .chat-msgs::-webkit-scrollbar-thumb { background:var(--pc); }

        .message { margin-bottom:10px; animation:msgIn .25s ease-out; }
        .message.user { text-align:right; }
        .msg-bubble {
            display:inline-block; max-width:84%;
            padding:9px 13px; font-size:13px; line-height:1.5;
            word-break:break-word;
            border:1px solid var(--bc); background:var(--pg);
            clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
            box-shadow:0 0 12px var(--pg);
        }
        .message.user .msg-bubble { color:var(--pc); }
        .message.ai  .msg-bubble  { color:#ddf4ff; }
        .msg-bubble.streaming::after { content:'▊'; animation:blink 1s infinite; color:var(--pc); }
        .msg-time { font-size:9px; color:var(--pc); opacity:.5; margin-top:3px; letter-spacing:1px; }

        .typing-ind { display:none; padding:8px 12px; }
        .typing-dots { display:flex; gap:3px; }
        .typing-dots span {
            width:7px; height:7px; background:var(--pc);
            animation:typingDot 1.4s infinite;
            clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
        }
        .typing-dots span:nth-child(2){animation-delay:.2s}
        .typing-dots span:nth-child(3){animation-delay:.4s}

        /* ── Input area ── */
        .input-area {
            flex-shrink:0; padding:9px 11px;
            background:rgba(0,0,0,.98);
            border-top:1px solid var(--bc);
            box-shadow:0 0 18px var(--pg);
        }

        /* Top control row */
        .ctrl-row {
            display:flex; align-items:center; gap:7px; margin-bottom:8px;
        }

        /* Icon toggle buttons (TTS, AI) */
        .ico-toggle {
            width:36px; height:36px; flex-shrink:0;
            border:1px solid var(--bc); background:var(--pg); color:var(--pc);
            cursor:pointer; font-size:16px;
            display:flex; align-items:center; justify-content:center;
            transition:all .2s;
            clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
        }
        .ico-toggle.active { background:var(--pc); color:#000; box-shadow:0 0 14px var(--pg); }
        .ico-toggle:active { animation:btnPress .15s ease; }

        .ctrl-sep { width:1px; height:34px; background:var(--bc); opacity:.35; flex-shrink:0; margin:0 2px; }

        /* Motor row — 5 buttons in one horizontal line */
        .motor-row { display:flex; align-items:center; gap:3px; }
        .dp {
            width:32px; height:32px; flex-shrink:0;
            border:1px solid var(--bc); background:var(--pg); color:var(--pc);
            cursor:pointer; font-size:13px;
            display:flex; align-items:center; justify-content:center;
            transition:all .15s; user-select:none;
            clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
        }
        .dp:active { background:var(--pc); color:#000; box-shadow:0 0 12px var(--pg); }
        .dp-c { background:rgba(0,0,0,.55); font-size:11px; }

        /* Message input row */
        .input-row { display:flex; gap:7px; align-items:flex-end; }
        .msg-input {
            flex:1; padding:10px 13px; font-size:14px;
            border:1px solid var(--bc); background:rgba(0,0,0,.85);
            color:var(--pc); font-family:'Courier New',monospace;
            resize:none; max-height:70px; min-height:42px; outline:none;
            clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
        }
        .msg-input::placeholder { color:rgba(0,200,255,.35); }
        .ico-btn {
            width:42px; height:42px; flex-shrink:0;
            border:1px solid var(--bc); background:rgba(0,0,0,.9); color:var(--pc);
            cursor:pointer; font-size:18px;
            display:flex; align-items:center; justify-content:center;
            transition:all .2s;
            clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
        }
        .ico-btn:active { background:var(--pc); color:#000; box-shadow:0 0 18px var(--pg); }
        .voice-btn.recording { background:var(--pc); color:#000; animation:recPulse 1s infinite; }

        /* ════════════════════════
           RIGHT — MEDIA PANEL
        ════════════════════════ */
        .media-panel {
            display:grid;
            grid-template-rows:1fr auto;
            background:rgba(0,0,0,.9);
        }

        /* Camera */
        .cam-wrap {
            position:relative; overflow:hidden; background:#000;
            clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
            box-shadow:inset 0 0 50px rgba(0,0,0,.7), 0 0 18px var(--pg);
        }
        .cam-wrap::after {
            content:''; position:absolute; left:0; right:0; height:4px;
            background:linear-gradient(180deg,transparent,var(--pc) 50%,transparent);
            animation:scanV 4s linear infinite; z-index:10; pointer-events:none;
            box-shadow:0 0 14px var(--pc), 0 0 28px var(--pg);
        }
        .cam-wrap::before {
            content:''; position:absolute; inset:0;
            background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.22) 2px,rgba(0,0,0,.22) 4px);
            pointer-events:none; z-index:5;
        }
        .cam-corner { position:absolute; width:18px; height:18px; z-index:15; pointer-events:none; }
        .cam-corner.tl { top:8px;    left:8px;    border-top:2px solid var(--pc); border-left:2px solid var(--pc); }
        .cam-corner.tr { top:8px;    right:8px;   border-top:2px solid var(--pc); border-right:2px solid var(--pc); }
        .cam-corner.bl { bottom:8px; left:8px;    border-bottom:2px solid var(--pc); border-left:2px solid var(--pc); }
        .cam-corner.br { bottom:8px; right:8px;   border-bottom:2px solid var(--pc); border-right:2px solid var(--pc); }

        #webcamPlaceholder {
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            height:100%; color:var(--pc); text-align:center;
            letter-spacing:2px; opacity:.55; gap:10px; text-transform:uppercase; font-size:13px;
        }
        .cam-icon { font-size:40px; opacity:.35; }
        #webcamVideo { width:100%; height:100%; object-fit:cover; display:none; }

        /* Sound overlay */
        .sound-overlay {
            position:absolute; bottom:10px; left:10px; z-index:20;
            display:flex; flex-direction:column; gap:5px; pointer-events:none;
        }
        .sound-item {
            background:rgba(0,0,0,.88); border:1px solid var(--bc);
            padding:6px 10px; min-width:165px;
            clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
            box-shadow:0 0 10px var(--pg);
        }
        .sound-head  { display:flex; justify-content:space-between; margin-bottom:3px; }
        .sound-label { font-size:10px; color:var(--pc); text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
        .sound-rank  { font-size:9px; color:var(--pc); background:var(--pg); padding:1px 4px; }
        .sound-bar   { height:3px; background:rgba(0,0,0,.8); border:1px solid var(--bc); overflow:hidden; }
        .sound-fill  { height:100%; background:linear-gradient(90deg,var(--sc),var(--pc)); transition:width .3s; }
        .sound-pct   { font-size:9px; color:var(--pc); text-align:right; margin-top:2px; }

        /* Cam buttons */
        .cam-btns {
            position:absolute; bottom:10px; right:10px; z-index:20;
            display:flex; flex-direction:column; gap:5px;
        }
        .cam-btn {
            width:36px; height:36px; border:1px solid var(--bc);
            background:rgba(0,0,0,.92); color:var(--pc);
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            font-size:16px; transition:all .2s;
            clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
        }
        .cam-btn:active { background:var(--pc); color:#000; }

        /* Status bar */
        .status-bar {
            padding:7px 14px; flex-shrink:0;
            background:rgba(0,0,0,.98);
            border-top:1px solid var(--bc);
            display:flex; align-items:center; justify-content:space-between;
            font-size:10px; color:var(--pc); letter-spacing:2px; text-transform:uppercase;
            box-shadow:0 0 14px var(--pg);
        }
        .sound-bars { display:flex; align-items:flex-end; gap:2px; height:14px; }
        .sbar { width:3px; background:var(--pc); opacity:.6; animation:soundBar 1s ease-in-out infinite; }
        .sbar:nth-child(1){height:35%;animation-delay:.00s}
        .sbar:nth-child(2){height:65%;animation-delay:.10s}
        .sbar:nth-child(3){height:100%;animation-delay:.20s}
        .sbar:nth-child(4){height:50%;animation-delay:.30s}
        .sbar:nth-child(5){height:75%;animation-delay:.15s}

        /* Mode badge */
        .mode-badge {
            position:fixed; top:7px; right:8px; z-index:999;
            padding:5px 12px; background:rgba(0,0,0,.96);
            border:1px solid var(--bc); color:var(--pc);
            font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
            clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
            box-shadow:0 0 12px var(--pg);
            animation:glowPulse 2.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="mode-normal">

<div class="bg-grid"></div>
<div class="hex-deco">
    <div class="hex"></div><div class="hex"></div>
    <div class="hex"></div><div class="hex"></div>
</div>

<div class="mode-badge" id="modeBadge">◈ NORMAL MODE</div>

<div class="app">

    <!-- ═══════════ LEFT: CHAT ═══════════ -->
    <div class="chat-panel">

        <div class="chat-header">
            <div>
                <div class="logo">◢ ARCos ◣</div>
                <div class="logo-sub">ADVANCED ROBOTICS INTERFACE</div>
            </div>
            <div class="lang-sel">

        <div class="chat-msgs" id="chatMessages">

            </div>
            <div class="typing-ind" id="typingIndicator">
                <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
        </div>

        <div class="input-area">
            <!-- 아이콘 토글 + D-Pad 모터 컨트롤 -->
            <div class="ctrl-row">
                <button class="ico-toggle active" id="ttsToggle"     title="TTS 온/오프">🔊</button>
                <button class="ico-toggle"        id="autoSendImage" title="AUTO AI 온/오프">⚡</button>

                <div class="ctrl-sep"></div>

                <!-- 모터 가로 일렬 배치: ◀ ▼ ◉ ▲ ▶ -->
                <div class="motor-row">
                    <button class="dp"     onclick="motorStep(-10,0)"  title="좌">◀</button>
                    <button class="dp"     onclick="motorStep(0,10)"  title="아래">▼</button>
                    <button class="dp dp-c" onclick="motorStep(0,0)"   title="원점정지">◉</button>
                    <button class="dp"     onclick="motorStep(0,-10)"   title="위">▲</button>
                    <button class="dp"     onclick="motorStep(10,0)"   title="우">▶</button>
                </div>
            </div>

            <!-- 메시지 입력 -->
            <div class="input-row">
                <textarea class="msg-input" id="messageInput" placeholder="ENTER MESSAGE..." rows="1"></textarea>
                <button class="ico-btn voice-btn" id="voiceBtn" title="음성입력">🎤</button>
                <button class="ico-btn"           id="sendBtn"  title="전송">➤</button>
            </div>
        </div>
    </div>

    <!-- ═══════════ RIGHT: MEDIA ═══════════ -->
    <div class="media-panel">

        <div class="cam-wrap">
            <div class="cam-corner tl"></div>
            <div class="cam-corner tr"></div>
            <div class="cam-corner bl"></div>
            <div class="cam-corner br"></div>

            <div class="sound-overlay" id="soundEventsOverlay"></div>

            <div id="webcamPlaceholder">
                <div class="cam-icon">📷</div>
                <span>CAMERA OFFLINE</span>
                <span style="font-size:10px;opacity:.4">TAP 📷 TO ACTIVATE</span>
            </div>
            <img id="webcamVideo" alt="cam">

            <div class="cam-btns">
                <button class="cam-btn" id="startWebcam" title="카메라 시작">📷</button>
                <button class="cam-btn" id="stopWebcam"  title="카메라 정지" style="display:none">⏹</button>
            </div>
        </div>

        <div class="status-bar">
            <span id="statusText">[ SYSTEM READY ]</span>
            <div class="sound-bars">
                <div class="sbar"></div><div class="sbar"></div>
                <div class="sbar"></div><div class="sbar"></div><div class="sbar"></div>
            </div>
        </div>
    </div>
</div>

const LANGUAGE_VOICES = {
    ar:2, cs:4, de:6, en:8, es:11, fa:13, fi:15, fil:17, fr:19, hi:21,
    hu:23, id:25, it:27, ja:29, km:31, ko:34, mn:36, ms:38, nl:40,

    ko:'안녕하세요! 저는 ARCos입니다. 텍스트와 음성으로 대화할 수 있어요! 🤖',

/* ══════════════════════════════════
   MOTOR
══════════════════════════════════ */
const MOTOR_URL = 'http://127.0.0.1:8080/api/motor';

function motorStep(pan, tilt) {
    fetch(MOTOR_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pan, tilt })
    }).catch(() => {});
}

/* ══════════════════════════════════
   MAIN APP
══════════════════════════════════ */
let lastTime = 0;

class AIChatApp {
    constructor() {
        this.apiBaseUrl  = 'http://127.0.0.1:59532';
        this.ttsBaseUrl  = 'http://127.0.0.1:59530/v2';
        this.soundApiUrl = 'http://127.0.0.1:8001/sound';

        this.currentLang   = 'ko';
        this.currentVoice  = 34;
        this.currentSystem = LANGUAGE_SYSTEMS['ko'];

        this.isRecording   = false;
        this.mediaRecorder = null;
        this.gumStream     = null;

        this.ttsQueue     = [];
        this.isPlayingTts = false;

        this.isTtsEnabled  = true;
        this.autoSendImage = false;  // AUTO 모드
        this.webcamStream  = null;

        this.initEl();
        this.bind();
        this.startSoundMonitoring();
    }

    initEl() {
        this.el = {
            chatMessages:       document.getElementById('chatMessages'),
            messageInput:       document.getElementById('messageInput'),
            sendBtn:            document.getElementById('sendBtn'),
            voiceBtn:           document.getElementById('voiceBtn'),
            ttsToggle:          document.getElementById('ttsToggle'),
            autoSendImage:      document.getElementById('autoSendImage'),
            statusText:         document.getElementById('statusText'),
            languageSelect:     document.getElementById('languageSelect'),
            modeBadge:          document.getElementById('modeBadge'),
            webcamVideo:        document.getElementById('webcamVideo'),
            webcamPlaceholder:  document.getElementById('webcamPlaceholder'),
            startWebcam:        document.getElementById('startWebcam'),
            stopWebcam:         document.getElementById('stopWebcam'),
            soundEventsOverlay: document.getElementById('soundEventsOverlay'),
        };
    }

    bind() {
        this.el.sendBtn.addEventListener('click',      () => this.sendMessage());
        this.el.messageInput.addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.sendMessage(); }
        });
        this.el.voiceBtn.addEventListener('click',        () => this.toggleVoiceRecording());
        this.el.ttsToggle.addEventListener('click',       () => this.toggleTts());
        this.el.autoSendImage.addEventListener('click',   () => this.toggleAutoMode());
        this.el.languageSelect.addEventListener('change', e => this.changeLanguage(e.target.value));
        this.el.startWebcam.addEventListener('click',     () => this.startWebcam());
        this.el.stopWebcam.addEventListener('click',      () => this.stopWebcam());
    }

    /* ── Sound monitoring ── */
    startSoundMonitoring() {
        setInterval(async () => {
            try {
                const r = await fetch(this.soundApiUrl);
                const d = await r.json();
                if (d.result && Array.isArray(d.data)) this.updateSoundEvents(d.data);
            } catch(e) {}
        }, 1000);
    }

    updateSoundEvents(data) {
        const top = data
            .map(([label, prob]) => ({ label, prob: parseFloat(prob) }))
            .sort((a, b) => b.prob - a.prob)
            .slice(0, 3);
        const overlay = this.el.soundEventsOverlay;
        overlay.innerHTML = '';
        ['🥇','🥈','🥉'].forEach((rank, i) => {
            if (!top[i]) return;
            const pct = (top[i].prob * 100).toFixed(1);
            const el = document.createElement('div');
            el.className = 'sound-item';
            el.innerHTML = `
                <div class="sound-head">
                    <span class="sound-label">${top[i].label}</span>
                    <span class="sound-rank">${rank}</span>
                </div>
                <div class="sound-bar"><div class="sound-fill" style="width:${pct}%"></div></div>
                <div class="sound-pct">${pct}%</div>`;
            overlay.appendChild(el);
        });
    }

    /* ── Language ── */
    changeLanguage(lang) {
        this.currentLang   = lang;
        this.currentVoice  = LANGUAGE_VOICES[lang] || 8;
        this.currentSystem = LANGUAGE_SYSTEMS[lang] || LANGUAGE_SYSTEMS['en'];
        const welcome = WELCOME_MESSAGES[lang] || WELCOME_MESSAGES['en'];
        this.el.chatMessages.innerHTML = '';
        this.el.chatMessages.appendChild(this.createMsg(welcome, 'ai'));
        this.setStatus(`LANG: ${lang.toUpperCase()}`);
    }

    setStatus(msg) {
        this.el.statusText.textContent = `[ ${msg} ]`;
        setTimeout(() => { this.el.statusText.textContent = '[ SYSTEM READY ]'; }, 3000);
    }

    /* ── Text send ── */
    async sendMessage() {
        const msg = this.el.messageInput.value.trim();
        if (!msg) return;
        this.el.messageInput.value = '';
        await this.sendTextMessage(msg);
    }

    async sendTextMessage(message) {
        lastTime = Date.now();
        this.addMsg(message, 'user');
        const { aiDiv, bubble } = this.appendStreamBubble();
        try {
            const resp = await fetch(`${this.apiBaseUrl}/v1/txt2chat?` + new URLSearchParams({
                prompt: message, system: this.currentSystem, isPlay: '0', lang: this.currentLang
            }));
            if (!resp.ok) throw new Error();
            await this.streamResponse(resp, bubble);
        } catch(e) {
            bubble.classList.remove('streaming');
            bubble.textContent = '[ CONNECTION ERROR ]';
        }
    }

    /* ── AUTO mode: GET /v2/img2chat (프롬프트만 전송, 이미지 불필요) ── */
    async sendAutoPrompt(prompt) {
        lastTime = Date.now();
        this.addMsg(`🤖 AUTO: ${prompt}`, 'user');
        const { aiDiv, bubble } = this.appendStreamBubble();
        try {
            const resp = await fetch(`${this.apiBaseUrl}/v2/img2chat?` + new URLSearchParams({
                prompt, system: this.currentSystem, isPlay: '0', lang: this.currentLang
            }));
            if (!resp.ok) throw new Error();
            await this.streamResponse(resp, bubble);
        } catch(e) {
            bubble.classList.remove('streaming');
            bubble.textContent = '[ AUTO SCAN FAILED ]';
        }
    }

    /* ── Shared stream reader ── */
    async streamResponse(resp, bubble) {
        const reader = resp.body.getReader();
        const dec    = new TextDecoder();
        let full = '', lastEnd = 0;
        while (true) {
            const { done, value } = await reader.read();
            if (done) {
                fetch('http://127.0.0.1:8000/stop');
                bubble.classList.remove('streaming');
                break;
            }
            full += dec.decode(value, { stream: true }) + '\n';
            bubble.innerHTML = this.parseMd(full);
            this.scrollBot();
            if (this.isTtsEnabled) {
                const sents = full.slice(lastEnd).match(/[^.!?]*[.!?]/g);
                if (sents) {
                    sents.forEach(s => { if (s.trim()) this.addToTtsQueue(s.trim()); });
                    lastEnd = full.length;
                }
            }
        }
        if (this.isTtsEnabled && full.slice(lastEnd).trim()) this.addToTtsQueue(full.slice(lastEnd).trim());
    }

    appendStreamBubble() {
        const aiDiv = this.createMsg('', 'ai');
        const bubble = aiDiv.querySelector('.msg-bubble');
        bubble.classList.add('streaming');
        this.el.chatMessages.appendChild(aiDiv);
        this.scrollBot();
        return { aiDiv, bubble };
    }

    /* ── Voice recording ── */
    async toggleVoiceRecording() {
        if (!this.isRecording) await this.startRecording();
        else this.stopRecording();
    }

    async startRecording() {
        if (this.isRecording) return;
        let chunks = [];
        try {
            this.isRecording = true;
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            this.gumStream = stream;
            this.mediaRecorder = new MediaRecorder(stream, { audioBitsPerSecond: 16000 });
            this.mediaRecorder.ondataavailable = e => chunks.push(e.data);
            this.mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/ogg;codecs=opus' });
                const fd   = new FormData();
                fd.append('file', blob, 'voice.ogg');
                try {
                    this.setStatus('PROCESSING...');
                    const r = await fetch(`${this.apiBaseUrl}/v1/stt?lang=${this.currentLang}&isPlay=0`, { method: 'POST', body: fd });
                    const d = await r.json();
                    const text = (d.text || d.data || '').trim();
                    if (text) {
                        this.el.messageInput.value = text;
                        this.setStatus('RECOGNIZED');
                        setTimeout(() => this.sendMessage(), 400);
                    } else { this.setStatus('NOT RECOGNIZED'); }
                } catch(e) { this.setStatus('VOICE FAILED'); }
                chunks = [];
            };
            this.mediaRecorder.start();
            this.el.voiceBtn.classList.add('recording');
            this.setStatus('● REC...');
        } catch(e) {
            this.isRecording = false;
            this.el.voiceBtn.classList.remove('recording');
            this.setStatus('MIC DENIED');
        }
    }

    stopRecording() {
        if (!this.isRecording) return;
        this.isRecording = false;
        this.el.voiceBtn.classList.remove('recording');
        if (this.mediaRecorder?.state !== 'inactive') this.mediaRecorder.stop();
        this.gumStream?.getAudioTracks().forEach(t => t.stop());
        this.gumStream = null;
    }

    /* ── TTS queue ── */
    addToTtsQueue(text) {
        lastTime = Date.now();
        this.ttsQueue.push(text);
        this.processTtsQueue();
    }

    async processTtsQueue() {
        if (this.isPlayingTts || this.ttsQueue.length === 0) return;
        this.isPlayingTts = true;
        const motions = ['motion','motion?name=test1','motion?name=test2','motion?name=test3'];
        fetch(`http://127.0.0.1:8000/${motions[Date.now() % 4]}`);
        while (this.ttsQueue.length > 0) await this.playTts(this.ttsQueue.shift());
        fetch('http://127.0.0.1:8000/stop');
        this.isPlayingTts = false;
        lastTime = Date.now();
    }

    playTts(text) {
        return new Promise(resolve => {
            const audio = new Audio(`${this.ttsBaseUrl}/tts?` + new URLSearchParams({
                text, voice: this.currentVoice - 1, lang: this.currentLang, static: '0', isPlay: '0'
            }));
            audio.onended = resolve; audio.onerror = resolve;
            audio.play().catch(resolve);
        });
    }

    /* ── Webcam ── */
    async startWebcam() {
        try {
            const r = await fetch('http://127.0.0.1:59531/start_collection');
            if (!r.ok) throw new Error();
            this.webcamStream = true;
            this.el.webcamVideo.style.display     = 'block';
            this.el.webcamPlaceholder.style.display = 'none';
            this.el.startWebcam.style.display     = 'none';
            this.el.stopWebcam.style.display      = 'flex';
            this.el.webcamVideo.src = 'http://127.0.0.1:59531/video_feed';
            await fetch('http://127.0.0.1:8000/init_mcr');
            this.setStatus('CAMERA ONLINE');
        } catch(e) { this.setStatus('CAM FAILED'); }
    }

    stopWebcam() {
        this.webcamStream = null;
        this.el.webcamVideo.style.display       = 'none';
        this.el.webcamPlaceholder.style.display = 'flex';
        this.el.startWebcam.style.display       = 'flex';
        this.el.stopWebcam.style.display        = 'none';
        this.setStatus('CAMERA OFFLINE');
    }

    /* ── Helpers ── */
    parseMd(text) {
        return text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g,     '<em>$1</em>')
            .replace(/`(.*?)`/g,       '<code>$1</code>')
            .replace(/\n/g,            '<br>');
    }

    createMsg(message, sender) {
        const div    = document.createElement('div');
        div.className = `message ${sender}`;
        const bubble  = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = message;
        const time = document.createElement('div');
        time.className = 'msg-time';
        const now  = new Date();
        time.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        div.appendChild(bubble); div.appendChild(time);
        return div;
    }

    addMsg(message, sender) {
        this.el.chatMessages.appendChild(this.createMsg(message, sender));
        this.scrollBot();
    }

    scrollBot() {
        requestAnimationFrame(() => {
            this.el.chatMessages.scrollTop = this.el.chatMessages.scrollHeight;
        });
    }

    toggleTts() {
        this.isTtsEnabled = !this.isTtsEnabled;
        this.el.ttsToggle.classList.toggle('active', this.isTtsEnabled);
        this.setStatus(this.isTtsEnabled ? 'TTS ON' : 'TTS OFF');
    }

    toggleAutoMode() {
        this.autoSendImage = !this.autoSendImage;
        this.el.autoSendImage.classList.toggle('active', this.autoSendImage);
        if (this.autoSendImage) {
            document.body.classList.replace('mode-normal', 'mode-auto');
            this.el.modeBadge.textContent = '◈ AUTO MODE';
            this.setStatus('AUTO MODE ON');
        } else {
            document.body.classList.replace('mode-auto', 'mode-normal');
            this.el.modeBadge.textContent = '◈ NORMAL MODE';
            this.setStatus('NORMAL MODE');
        }
    }
}

/* ══════════════════════════════════
   INIT
══════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
    const ai = new AIChatApp();

    /* Heartbeat: 얼굴 트래킹 + AUTO 모드 */
    setInterval(async () => {
        try {
            const resp = await fetch('http://127.0.0.1:59531/heartbeat');
            const data = (await resp.json()).data;
            const pos  = data.human.position;

            /* 얼굴 트래킹 → 모터 API */
            if (data.cnt_live > 0 && pos && pos !== 'C') {
                let pan = 0, tilt = 0;
                // Tilt: T(위) → +, B(아래) → -
                if      (pos.startsWith('T')) tilt = -10;
                else if (pos.startsWith('B')) tilt = 10;
                // Pan: L(좌) → +, R(우) → -
                if      (pos.endsWith('L')) pan = +10;
                else if (pos.endsWith('R')) pan = -10;
                if (pan !== 0 || tilt !== 0) motorStep(pan, tilt);
            }

            /* AUTO 모드: 30초마다 GET /v2/img2chat 호출 */
            if (ai.autoSendImage && data.cnt_live > 0 && Date.now() - lastTime > 30000) {
                lastTime = Date.now();
                fetch('http://127.0.0.1:8000/stop');
                const gender = data.human.gender === 'M' ? 'Male' : 'Female';
                const prompt = `${LANGUAGE_GREETINGS[ai.currentLang]} ${gender}, ${data.human.age} years, ${data.human.emotion}`;
                ai.sendAutoPrompt(prompt);
            }
        } catch(e) {}
    }, 1000);
});
