<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCos - Advanced Robotics Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --pc: #00c8ff;
            --pg: rgba(0,200,255,0.18);
            --sc: #0080ff;
            --bc: #00c8ff;
            --gc: rgba(0,200,255,0.25);
            --red: #ff0040;
            --rg: rgba(255,0,64,0.18);
        }
        .mode-auto {
            --pc: #ff0040; --pg: rgba(255,0,64,0.18);
            --sc: #ff0080; --bc: #ff0040; --gc: rgba(255,0,64,0.25);
        }

        @keyframes glowPulse { 0%,100%{opacity:.6} 50%{opacity:1} }
        @keyframes scanV { 0%{top:-6px;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{top:100%;opacity:0} }
        @keyframes gridMove { 0%{transform:translateY(0)} 100%{transform:translateY(40px)} }
        @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
        @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        @keyframes recordPulse { 0%,100%{box-shadow:0 0 20px var(--pg)} 50%{box-shadow:0 0 40px var(--pg)} }
        @keyframes typing { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-6px);opacity:1} }
        @keyframes borderFlow {
            0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
        }
        @keyframes cornerSpin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        @keyframes soundBar { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }
        @keyframes hexPulse { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:.7;transform:scale(1.05)} }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            touch-action: manipulation;
        }

        /* ── BG Grid ── */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(0deg, transparent 49%, var(--gc) 50%, transparent 51%),
                linear-gradient(90deg, transparent 49%, var(--gc) 50%, transparent 51%);
            background-size: 40px 40px;
            animation: gridMove 8s linear infinite;
            opacity: .4;
        }

        /* ── HEX DECO ── */
        .hex-deco {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .hex {
            position: absolute; width: 80px; height: 80px;
            border: 1px solid var(--pc); opacity: .12;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: hexPulse 4s ease-in-out infinite;
        }
        .hex:nth-child(1){top:5%;left:3%;animation-delay:0s}
        .hex:nth-child(2){top:70%;left:1%;animation-delay:1s;width:50px;height:50px}
        .hex:nth-child(3){top:20%;right:2%;animation-delay:2s;width:60px;height:60px}
        .hex:nth-child(4){bottom:5%;right:4%;animation-delay:.5s}
        .hex:nth-child(5){top:45%;left:50%;animation-delay:1.5s;width:40px;height:40px;opacity:.07}

        /* ── LAYOUT ── */
        .app { 
            position: relative; z-index:1;
            display: grid;
            grid-template-columns: 310px 1fr;
            grid-template-rows: 1fr;
            width: 100vw; height: 100vh;
        }

        /* ══════════════════════════════
           LEFT: CHAT PANEL
        ══════════════════════════════ */
        .chat-panel {
            display: flex; flex-direction: column;
            border-right: 2px solid var(--bc);
            background: rgba(0,0,0,.92);
            position: relative;
            box-shadow: 4px 0 30px var(--pg);
            min-height: 0; overflow: hidden;
        }

        /* Header */
        .chat-header {
            height: 52px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 14px;
            background: rgba(0,0,0,.97);
            border-bottom: 1px solid var(--bc);
            position: relative;
            flex-shrink: 0;
        }
        .chat-header::after {
            content:''; position:absolute; bottom:-2px; left:0; right:0; height:2px;
            background: linear-gradient(90deg, transparent, var(--pc), transparent);
            box-shadow: 0 0 12px var(--pg);
            animation: glowPulse 2s ease-in-out infinite;
        }
        .logo {
            font-size: 18px; font-weight:700; letter-spacing:3px;
            color: var(--pc); text-shadow: 0 0 12px var(--pc), 0 0 24px var(--pg);
            text-transform: uppercase;
        }
        .logo-sub { font-size:9px; letter-spacing:2px; color:var(--pc); opacity:.6; margin-top:1px; }

        /* Language select */
        .lang-wrap select {
            padding: 5px 8px; background: rgba(0,0,0,.9);
            border: 1px solid var(--bc); color: var(--pc);
            font-family: 'Courier New', monospace; font-size: 12px;
            cursor: pointer; outline: none;
            clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
        }

        /* Messages */
        .chat-messages {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 12px;
            scrollbar-width: thin; scrollbar-color: var(--pc) transparent;
            min-height: 0;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--pc); }

        .message { margin-bottom: 10px; animation: msgIn .25s ease-out; }
        .message.user { text-align: right; }
        .message-bubble {
            display: inline-block; max-width: 82%;
            padding: 9px 13px; font-size: 13px; line-height: 1.45;
            word-break: break-word;
            border: 1px solid var(--bc);
            background: var(--pg);
            clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
            box-shadow: 0 0 14px var(--pg);
        }
        .message.user .message-bubble { color: var(--pc); }
        .message.ai .message-bubble { color: #e8f8ff; }
        .message-bubble.streaming::after { content:'▊'; animation: blink 1s infinite; color: var(--pc); }
        .message-time { font-size: 9px; color: var(--pc); opacity:.6; margin-top:3px; letter-spacing:1px; }

        /* Typing */
        .typing-indicator { display:none; padding:8px 12px; }
        .typing-dots { display:flex; gap:3px; }
        .typing-dots span {
            width:7px; height:7px; background:var(--pc);
            animation: typing 1.4s infinite;
            clip-path: polygon(50% 0%,100% 50%,50% 100%,0% 50%);
        }
        .typing-dots span:nth-child(2){animation-delay:.2s}
        .typing-dots span:nth-child(3){animation-delay:.4s}

        /* Input area */
        .input-area {
            padding: 10px 12px;
            background: rgba(0,0,0,.97);
            border-top: 1px solid var(--bc);
            box-shadow: 0 0 20px var(--pg);
            flex-shrink: 0;
        }
        .ctrl-row {
            display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;
        }
        .ctrl-btn {
            padding: 8px 11px; font-size: 11px; font-weight:700;
            font-family: 'Courier New', monospace; text-transform: uppercase; letter-spacing:.5px;
            border: 1px solid var(--bc); background: var(--pg); color: var(--pc);
            cursor: pointer; transition: all .2s;
            clip-path: polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
            min-width: 44px; min-height: 36px;
            -webkit-tap-highlight-color: transparent;
        }
        .ctrl-btn:active, .ctrl-btn.active {
            background: var(--pc); color: #000;
            box-shadow: 0 0 20px var(--pg);
        }
        .input-row { display:flex; gap:8px; align-items:flex-end; }
        .msg-input {
            flex:1; padding: 11px 14px; font-size: 14px;
            border: 1px solid var(--bc); background: rgba(0,0,0,.85);
            color: var(--pc); font-family: 'Courier New', monospace;
            resize: none; max-height: 80px; min-height: 44px;
            clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
            outline: none;
        }
        .msg-input::placeholder { color: rgba(0,200,255,.4); }
        .icon-btn {
            width: 44px; height: 44px; border: 1px solid var(--bc);
            background: rgba(0,0,0,.9); color: var(--pc); cursor: pointer;
            display:flex; align-items:center; justify-content:center;
            font-size: 18px; transition: all .2s;
            clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
            flex-shrink: 0;
        }
        .icon-btn:active { background: var(--pc); color:#000; box-shadow:0 0 20px var(--pg); }
        .voice-btn.recording {
            background: var(--pc); color: #000;
            animation: recordPulse 1s infinite;
        }

        /* ══════════════════════════════
           RIGHT: MEDIA PANEL
        ══════════════════════════════ */
        .media-panel {
            display: grid;
            grid-template-rows: 1fr auto auto;
            background: rgba(0,0,0,.9);
            position: relative;
        }

        /* Action buttons row */
        .action-bar {
            display: flex; gap: 6px; flex-wrap: wrap;
            padding: 8px 10px;
            background: rgba(0,0,0,.97);
            border-bottom: 1px solid var(--bc);
            box-shadow: 0 4px 20px var(--pg);
        }
        .act-btn {
            padding: 8px 12px; font-size: 11px; font-weight:700;
            font-family: 'Courier New', monospace; text-transform: uppercase;
            border: 1px solid var(--bc); background: var(--pg); color: var(--pc);
            cursor: pointer; transition: all .2s;
            clip-path: polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
            min-height: 36px; flex: 1; white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .act-btn:active { background: var(--pc); color:#000; box-shadow:0 0 20px var(--pg); }

        /* Camera view */
        .cam-wrap {
            position: relative; overflow: hidden;
            background: #000;
            clip-path: polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
            box-shadow: inset 0 0 40px rgba(0,0,0,.6), 0 0 20px var(--pg);
        }

        /* Scan line */
        .cam-wrap::after {
            content:''; position:absolute; left:0; right:0; height:4px;
            background: linear-gradient(180deg,transparent,var(--pc) 50%,transparent);
            animation: scanV 3.5s linear infinite; z-index:10; pointer-events:none;
            box-shadow: 0 0 16px var(--pc), 0 0 32px var(--pg);
        }
        /* CRT scanlines */
        .cam-wrap::before {
            content:''; position:absolute; inset:0;
            background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.25) 2px,rgba(0,0,0,.25) 4px);
            pointer-events:none; z-index:5;
        }

        /* Corner brackets */
        .cam-corner {
            position:absolute; width:20px; height:20px; z-index:15; pointer-events:none;
        }
        .cam-corner.tl { top:8px; left:8px; border-top:2px solid var(--pc); border-left:2px solid var(--pc); }
        .cam-corner.tr { top:8px; right:8px; border-top:2px solid var(--pc); border-right:2px solid var(--pc); }
        .cam-corner.bl { bottom:8px; left:8px; border-bottom:2px solid var(--pc); border-left:2px solid var(--pc); }
        .cam-corner.br { bottom:8px; right:8px; border-bottom:2px solid var(--pc); border-right:2px solid var(--pc); }

        #webcamPlaceholder {
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            height:100%; color:var(--pc); font-size:13px; text-align:center;
            letter-spacing:2px; opacity:.6; gap:8px; text-transform:uppercase;
        }
        .cam-icon { font-size:36px; opacity:.4; }

        #webcamVideo { width:100%; height:100%; object-fit:cover; display:none; }

        /* Sound overlay */
        .sound-overlay {
            position:absolute; bottom:10px; left:10px; z-index:20;
            display:flex; flex-direction:column; gap:6px; pointer-events:none;
        }
        .sound-item {
            background: rgba(0,0,0,.88); border: 1px solid var(--bc);
            padding: 7px 11px; min-width:170px;
            clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
            box-shadow: 0 0 12px var(--pg);
        }
        .sound-head { display:flex; justify-content:space-between; margin-bottom:4px; }
        .sound-label { font-size:11px; color:var(--pc); text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
        .sound-rank { font-size:9px; color:var(--pc); background:var(--pg); padding:1px 5px; }
        .sound-bar { height:4px; background:rgba(0,0,0,.8); border:1px solid var(--bc); overflow:hidden; }
        .sound-fill {
            height:100%; background:linear-gradient(90deg,var(--sc),var(--pc));
            transition: width .3s; box-shadow:0 0 6px var(--pg);
        }
        .sound-pct { font-size:9px; color:var(--pc); text-align:right; margin-top:2px; }

        /* Cam buttons */
        .cam-btns {
            position:absolute; bottom:10px; right:10px; z-index:20;
            display:flex; flex-direction:column; gap:6px;
        }
        .cam-btn {
            width:38px; height:38px; border:1px solid var(--bc);
            background:rgba(0,0,0,.9); color:var(--pc);
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            font-size:17px; transition:all .2s;
            clip-path: polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
        }
        .cam-btn:active { background:var(--pc); color:#000; }

        /* Upload area */
        .upload-area {
            padding: 8px 10px;
            background: rgba(0,0,0,.95);
            border-top: 1px solid var(--bc);
            cursor: pointer;
            transition: all .2s;
            display: flex; align-items: center; gap: 10px;
            min-height: 56px;
        }
        .upload-area:active { background: rgba(0,0,0,1); box-shadow:0 0 12px var(--pg); }
        .upload-area input { display:none; }
        .upload-icon { font-size:22px; flex-shrink:0; }
        .upload-text { font-size:11px; color:var(--pc); opacity:.7; text-transform:uppercase; letter-spacing:1px; }
        #uploadedImage { max-height:40px; max-width:60px; border:1px solid var(--bc); }
        .remove-img {
            margin-left:auto; padding:5px 9px; font-size:10px;
            border:1px solid var(--bc); background:var(--pg); color:var(--pc);
            cursor:pointer; font-family:'Courier New',monospace; text-transform:uppercase;
        }
        .remove-img:active { background:var(--pc); color:#000; }

        /* Status bar */
        .status-bar {
            padding: 8px 14px;
            background: rgba(0,0,0,.97);
            border-top: 1px solid var(--bc);
            display: flex; align-items: center; justify-content: space-between;
            font-size: 10px; color: var(--pc); letter-spacing:2px; text-transform:uppercase;
            box-shadow: 0 0 16px var(--pg);
            flex-shrink: 0;
        }
        .status-dots { display:flex; gap:5px; }
        .status-dot {
            width:7px; height:7px; background:var(--pc); opacity:.5;
            clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
        }
        .status-dot.active { opacity:1; box-shadow:0 0 6px var(--pc); }

        /* Mode badge */
        .mode-badge {
            position:fixed; top:8px; right:8px; z-index:999;
            padding:6px 14px; background:rgba(0,0,0,.95);
            border:1px solid var(--bc); color:var(--pc);
            font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
            clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
            box-shadow:0 0 14px var(--pg);
            animation:glowPulse 2s ease-in-out infinite;
        }

        /* Sound bars visual */
        .sound-bars {
            display:flex; align-items:flex-end; gap:2px; height:16px;
        }
        .sbar {
            width:3px; background:var(--pc); opacity:.7;
            animation: soundBar 1s ease-in-out infinite;
        }
        .sbar:nth-child(1){height:40%;animation-delay:.0s}
        .sbar:nth-child(2){height:70%;animation-delay:.1s}
        .sbar:nth-child(3){height:100%;animation-delay:.2s}
        .sbar:nth-child(4){height:55%;animation-delay:.3s}
        .sbar:nth-child(5){height:80%;animation-delay:.15s}
    </style>
</head>

<script>
let lastTime = 0;

    initEl() {
        this.el = {
            chatMessages: document.getElementById('chatMessages'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            voiceBtn: document.getElementById('voiceBtn'),
            ttsToggle: document.getElementById('ttsToggle'),
            autoSendImage: document.getElementById('autoSendImage'),
            typingIndicator: document.getElementById('typingIndicator'),
            statusText: document.getElementById('statusText'),
            languageSelect: document.getElementById('languageSelect'),
            modeBadge: document.getElementById('modeBadge'),
            webcamVideo: document.getElementById('webcamVideo'),
            webcamPlaceholder: document.getElementById('webcamPlaceholder'),
            startWebcam: document.getElementById('startWebcam'),
            captureImage: document.getElementById('captureImage'),
            stopWebcam: document.getElementById('stopWebcam'),
            imageUpload: document.getElementById('imageUpload'),
            fileInput: document.getElementById('fileInput'),
            uploadText: document.getElementById('uploadText'),
            uploadedImage: document.getElementById('uploadedImage'),
            removeImage: document.getElementById('removeImage'),
            soundEventsOverlay: document.getElementById('soundEventsOverlay')
        };
    }

    bind() {
        this.el.sendBtn.addEventListener('click', () => this.sendMessage());
        this.el.messageInput.addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.sendMessage(); }
        });
        this.el.voiceBtn.addEventListener('click', () => this.toggleVoiceRecording());
        this.el.ttsToggle.addEventListener('click', () => this.toggleTts());
        this.el.autoSendImage.addEventListener('click', () => this.toggleAutoSendImage());
        this.el.languageSelect.addEventListener('change', e => this.changeLanguage(e.target.value));
        this.el.startWebcam.addEventListener('click', () => this.startWebcam());
        this.el.captureImage.addEventListener('click', () => this.captureImage());
        this.el.stopWebcam.addEventListener('click', () => this.stopWebcam());
        this.el.imageUpload.addEventListener('click', () => { if (!this.currentImage) this.el.fileInput.click(); });
        this.el.fileInput.addEventListener('change', e => this.handleFileSelect(e));
        this.el.removeImage.addEventListener('click', e => { e.stopPropagation(); this.removeImage(); });
    }

    setupPaste() {
        document.addEventListener('paste', e => {
            for (let item of e.clipboardData.items) {
                if (item.type.indexOf('image') !== -1) {
                    const file = item.getAsFile();
                    this.displayImage(file);
                    if (this.autoSendImage) setTimeout(() => this.sendImageMessage(), 500);
                    break;
                }
            }
        });
    }

    startSoundMonitoring() {
        setInterval(async () => {
            try {
                const r = await fetch(this.soundApiUrl);
                const d = await r.json();
                if (d.result && d.data && Array.isArray(d.data)) this.updateSoundEvents(d.data);
            } catch(e) {}
        }, 1000);
    }

    updateSoundEvents(soundData) {
        const top = soundData
            .map(([label,probability]) => ({label, probability: parseFloat(probability)}))
            .sort((a,b) => b.probability - a.probability)
            .slice(0,3);

        const overlay = this.el.soundEventsOverlay;
        overlay.innerHTML = '';
        const ranks = ['🥇','🥈','🥉'];

        top.forEach((ev, i) => {
            const pct = (ev.probability * 100).toFixed(1);
            const el = document.createElement('div');
            el.className = 'sound-item';
            el.innerHTML = `
                <div class="sound-head">
                    <span class="sound-label">${ev.label}</span>
                    <span class="sound-rank">${ranks[i]}</span>
                </div>
                <div class="sound-bar"><div class="sound-fill" style="width:${pct}%"></div></div>
                <div class="sound-pct">${pct}%</div>`;
            overlay.appendChild(el);
        });
    }

    changeLanguage(lang) {
        this.currentLang = lang;
        this.currentVoice = LANGUAGE_VOICES[lang] || 7;
        this.currentSystem = LANGUAGE_SYSTEMS[lang];
        const welcomeMsg = WELCOME_MESSAGES[lang] || WELCOME_MESSAGES['en'];
        this.el.chatMessages.innerHTML = '';
        const md = this.createMsg(welcomeMsg, 'ai');
        this.el.chatMessages.appendChild(md);
        const td = document.createElement('div');
        td.className = 'typing-indicator'; td.id = 'typingIndicator';
        td.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
        this.el.chatMessages.appendChild(td);
        this.el.typingIndicator = td;
        this.setStatus(`LANG: ${lang.toUpperCase()}`);
    }

    setStatus(msg) {
        this.el.statusText.textContent = `[ ${msg} ]`;
        setTimeout(() => { this.el.statusText.textContent = '[ SYSTEM READY ]'; }, 3000);
    }

    async sendMessage() {
        const msg = this.el.messageInput.value.trim();
        if (!msg && !this.currentImage) return;
        if (this.currentImage && msg) await this.sendImageMessage(msg);
        else if (this.currentImage) await this.sendImageMessage();
        else await this.sendTextMessage(msg);
        this.el.messageInput.value = '';
    }

    async sendTextMessage(message) {
        lastTime = Date.now();
        this.addMsg(message, 'user');
        const aiDiv = this.createMsg('', 'ai');
        const bubble = aiDiv.querySelector('.message-bubble');
        bubble.classList.add('streaming');
        this.el.chatMessages.appendChild(aiDiv);
        this.scrollBot();
        try {
            const resp = await fetch(`${this.apiBaseUrl}/txt2chat?` + new URLSearchParams({
                prompt: message, system: this.currentSystem, isPlay: '0', lang: this.currentLang
            }));
            if (!resp.ok) throw new Error('NETWORK ERROR');
            const reader = resp.body.getReader();
            const dec = new TextDecoder();
            let full = '', lastEnd = 0;
            while (true) {
                const {done, value} = await reader.read();
                if (done) {
                    fetch('http://127.0.0.1:8000/stop');
                    bubble.classList.remove('streaming');
                    break;
                }
                full += dec.decode(value, {stream:true}) + '\n';
                bubble.innerHTML = this.parseMd(full);
                this.scrollBot();
                if (this.isTtsEnabled) {
                    const sents = full.slice(lastEnd).match(/[^.!?]*[.!?]/g);
                    if (sents) {
                        sents.forEach(s => { if (s.trim()) this.addToTtsQueue(s.trim()); });
                        lastEnd = full.length;
                    }
                }
            }
            if (this.isTtsEnabled && full.slice(lastEnd).trim()) this.addToTtsQueue(full.slice(lastEnd).trim());
        } catch(e) {
            bubble.classList.remove('streaming');
            bubble.textContent = '[ CONNECTION ERROR ]';
        }
    }

    async sendImageMessage(message = '이미지를 설명해주세요', url = this.apiBaseUrl) {
        lastTime = Date.now();
        if (!this.currentImage) return;
        if (message !== '이미지를 설명해주세요') this.addMsg(message, 'user');
        this.addMsg('📸 ...', 'user');
        const aiDiv = this.createMsg('', 'ai');
        const bubble = aiDiv.querySelector('.message-bubble');
        bubble.classList.add('streaming');
        this.el.chatMessages.appendChild(aiDiv);
        this.scrollBot();
        try {
            const fd = new FormData();
            fd.append('file', this.currentImage);
            const resp = await fetch(`${url}/img2chat?` + new URLSearchParams({
                prompt: message, system: this.currentSystem, isPlay: '0', lang: this.currentLang
            }), { method: 'POST', body: fd });
            if (!resp.ok) throw new Error('NETWORK ERROR');
            const reader = resp.body.getReader();
            const dec = new TextDecoder();
            let full = '', lastEnd = 0;
            while (true) {
                const {done, value} = await reader.read();
                if (done) {
                    fetch('http://127.0.0.1:8000/stop');
                    bubble.classList.remove('streaming');
                    break;
                }
                full += dec.decode(value, {stream:true}) + '\n';
                bubble.innerHTML = this.parseMd(full);
                this.scrollBot();
                if (this.isTtsEnabled) {
                    const sents = full.slice(lastEnd).match(/[^.!?]*[.!?]/g);
                    if (sents) {
                        sents.forEach(s => { if (s.trim()) this.addToTtsQueue(s.trim()); });
                        lastEnd = full.length;
                    }
                }
            }
            if (this.isTtsEnabled && full.slice(lastEnd).trim()) this.addToTtsQueue(full.slice(lastEnd).trim());
            this.removeImage();
        } catch(e) {
            bubble.classList.remove('streaming');
            bubble.textContent = '[ IMAGE ANALYSIS FAILED ]';
        }
    }

    async toggleVoiceRecording() {
        if (!this.isRecording) await this.startRecording();
        else this.stopRecording();
    }

    async startRecording() {
        if (this.isRecording) return;
        let chunks = [];
        try {
            this.isRecording = true;
            const stream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
            this.gumStream = stream;
            this.mediaRecorder = new MediaRecorder(stream, {audioBitsPerSecond:16000});
            this.mediaRecorder.ondataavailable = e => chunks.push(e.data);
            this.mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, {type:'audio/ogg;codecs=opus'});
                const fd = new FormData();
                fd.append('file', blob, 'voice.ogg');
                try {
                    this.setStatus('PROCESSING VOICE');
                    const r = await fetch(`${this.apiBaseUrl}/stt?lang=${this.currentLang}&isPlay=0`, {method:'POST',body:fd});
                    if (!r.ok) throw new Error('STT ERROR');
                    const d = await r.json();
                    const text = d.text?.trim() || d.data?.trim();
                    if (text) {
                        this.el.messageInput.value = text;
                        this.setStatus('VOICE RECOGNIZED');
                        setTimeout(() => this.sendMessage(), 500);
                    } else { this.setStatus('NOT RECOGNIZED'); }
                } catch(e) { this.setStatus('VOICE FAILED'); }
                chunks = [];
            };
            this.mediaRecorder.start();
            this.el.voiceBtn.classList.add('recording');
            this.setStatus('REC...');
        } catch(e) {
            this.isRecording = false;
            this.el.voiceBtn.classList.remove('recording');
            this.setStatus('MIC DENIED');
        }
    }

    stopRecording() {
        if (!this.isRecording) return;
        this.isRecording = false;
        this.el.voiceBtn.classList.remove('recording');
        if (this.mediaRecorder?.state !== 'inactive') this.mediaRecorder.stop();
        if (this.gumStream) { this.gumStream.getAudioTracks().forEach(t => t.stop()); this.gumStream = null; }
    }

    parseMd(text) {
        return text
            .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
            .replace(/\*(.*?)\*/g,'<em>$1</em>')
            .replace(/`(.*?)`/g,'<code>$1</code>')
            .replace(/\n/g,'<br>');
    }

    addToTtsQueue(text) {
        lastTime = Date.now();
        this.ttsQueue.push(text);
        this.processTtsQueue();
    }

    async processTtsQueue() {
        if (this.isPlayingTts || this.ttsQueue.length === 0) return;
        this.isPlayingTts = true;
        const t = Date.now();
        const motions = ['motion','motion?name=test1','motion?name=test2','motion?name=test3'];
        fetch(`http://127.0.0.1:8000/${motions[t % 4]}`);
        while (this.ttsQueue.length > 0) {
            await this.playTts(this.ttsQueue.shift());
        }
        fetch('http://127.0.0.1:8000/stop');
        this.isPlayingTts = false;
        lastTime = Date.now();
    }

    playTts(text) {
        return new Promise(resolve => {
            const audio = new Audio(`${this.ttsBaseUrl}/tts?` + new URLSearchParams({
                text, voice: this.currentVoice - 1, lang: this.currentLang, static:'0', isPlay:'0'
            }));
            audio.onended = resolve;
            audio.onerror = resolve;
            audio.play().catch(resolve);
        });
    }

    async startWebcam() {
        try {
            const r = await fetch('http://127.0.0.1:59531/start_collection');
            if (!r.ok) throw new Error();
            this.webcamStream = true;
            this.el.webcamVideo.style.display = 'block';
            this.el.webcamPlaceholder.style.display = 'none';
            this.el.startWebcam.style.display = 'none';
            this.el.captureImage.style.display = 'flex';
            this.el.stopWebcam.style.display = 'flex';
            this.el.webcamVideo.src = 'http://127.0.0.1:59531/video_feed';
            await fetch('http://127.0.0.1:8000/init_mcr');
            this.setStatus('CAMERA ONLINE');
        } catch(e) { this.setStatus('CAM FAILED'); }
    }

    captureImage() {
        if (!this.webcamStream) { this.setStatus('CAMERA OFFLINE'); return; }
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        canvas.getContext('2d').drawImage(this.el.webcamVideo, 0, 0, 512, 512);
        canvas.toBlob(blob => {
            this.displayImage(blob, `capture-${Date.now()}.jpg`);
        }, 'image/jpeg', 0.9);
        this.setStatus('CAPTURED');
    }

    stopWebcam() {
        this.webcamStream = null;
        this.el.webcamVideo.style.display = 'none';
        this.el.webcamPlaceholder.style.display = 'flex';
        this.el.startWebcam.style.display = 'flex';
        this.el.captureImage.style.display = 'none';
        this.el.stopWebcam.style.display = 'none';
        this.setStatus('CAMERA OFFLINE');
    }

    handleFileSelect(e) {
        const file = e.target.files[0];
        if (file) {
            this.displayImage(file);
            if (this.autoSendImage) setTimeout(() => this.sendImageMessage(), 500);
        }
    }

    displayImage(file, filename = null) {
        this.currentImage = file;
        const url = URL.createObjectURL(file);
        this.el.uploadedImage.src = url;
        this.el.uploadedImage.style.display = 'block';
        this.el.uploadText.style.display = 'none';
        this.el.removeImage.style.display = 'block';
    }

    removeImage() {
        this.currentImage = null;
        this.el.uploadedImage.style.display = 'none';
        this.el.uploadText.style.display = 'block';
        this.el.removeImage.style.display = 'none';
        this.el.fileInput.value = '';
        if (this.el.uploadedImage.src) URL.revokeObjectURL(this.el.uploadedImage.src);
    }

    createMsg(message, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.textContent = message;
        const time = document.createElement('div');
        time.className = 'message-time';
        const now = new Date();
        time.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        div.appendChild(bubble);
        div.appendChild(time);
        return div;
    }

    addMsg(message, sender) {
        const div = this.createMsg(message, sender);
        this.el.chatMessages.appendChild(div);
        this.scrollBot();
    }

    scrollBot() {
        const el = this.el.chatMessages;
        requestAnimationFrame(() => {
            el.scrollTop = el.scrollHeight;
        });
    }

    toggleTts() {
        this.isTtsEnabled = !this.isTtsEnabled;
        this.el.ttsToggle.classList.toggle('active', this.isTtsEnabled);
        this.setStatus(this.isTtsEnabled ? 'TTS ON' : 'TTS OFF');
    }

    toggleAutoSendImage() {
        this.autoSendImage = !this.autoSendImage;
        this.el.autoSendImage.classList.toggle('active', this.autoSendImage);
        if (this.autoSendImage) {
            document.body.classList.remove('mode-normal');
            document.body.classList.add('mode-auto');
            this.el.modeBadge.textContent = '◈ AUTO MODE';
            this.setStatus('AUTO MODE ON');
        } else {
            document.body.classList.remove('mode-auto');
            document.body.classList.add('mode-normal');
            this.el.modeBadge.textContent = '◈ NORMAL MODE';
            this.setStatus('NORMAL MODE');
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const ai = new AIChatApp();

    const MOTOR_URL = 'http://127.0.0.1:8080/api/motor';
    const MOTOR_STEP = 10; // 한 번에 움직일 각도
    let motorPan = 0, motorTilt = 0;

    function sendMotor(pan, tilt) {
        fetch(MOTOR_URL, {
            method: 'POST',
            headers: { 'accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ pan, tilt })
        }).catch(() => {});
    }

    setInterval(async () => {
        try {
            const resp = await fetch('http://127.0.0.1:59531/heartbeat');
            const data = (await resp.json()).data;
            const pos = data.human.position;

            // 사람이 감지된 경우에만 트래킹
            if (data.cnt_live > 0 && pos && pos !== 'C') {
                let panDelta = 0, tiltDelta = 0;

                // 상하 (Tilt)
                if (pos.startsWith('T'))      tiltDelta = -MOTOR_STEP;  // 위에 있으면 위로
                else if (pos.startsWith('B')) tiltDelta = +MOTOR_STEP;  // 아래에 있으면 아래로

                // 좌우 (Pan)
                if (pos.endsWith('L'))      panDelta = +MOTOR_STEP;  // 왼쪽에 있으면 왼쪽으로
                else if (pos.endsWith('R')) panDelta = -MOTOR_STEP;  // 오른쪽에 있으면 오른쪽으로

                if (panDelta !== 0 || tiltDelta !== 0) {
                    sendMotor(panDelta, tiltDelta);
                }
            }
            if (Date.now() - lastTime > 30000 && data.cnt_live > 0 && ai.autoSendImage) {
                lastTime = Date.now();
                fetch('http://127.0.0.1:8000/stop');
                ai.captureImage();
                setTimeout(() => {
                    ai.sendImageMessage(
                        LANGUAGE_GREETINGS[ai.currentLang] + ` ${data.human.gender == 'M' ? 'Male' : 'Female'}, ${data.human.age} years, ${data.human.emotion}`,
                        'http://127.0.0.1:59532/v2'
                    );
                }, 1000);
            }
        } catch(e) {}
    }, 1000);
});

function play(name) { fetch(`http://127.0.0.1:8000/motion?name=${name}`); }
function stop() {}
</script>
