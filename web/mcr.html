
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 채팅 프로그램</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }

        .app-container {
            display: flex;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }

        .chat-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(15px);
        }

        .chat-header {
            padding: 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            flex: 1;
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .language-selector select {
            padding: 8px 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .language-selector select:hover {
            background: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 15px;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message-bubble {
            display: inline-block;
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .message.ai .message-bubble {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #1a1a1a;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .message-time {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .typing-indicator {
            display: none;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            max-width: 80px;
        }

        .typing-dots {
            display: flex;
            gap: 3px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4facfe;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .message-bubble.streaming {
            position: relative;
        }

        .message-bubble.streaming::after {
            content: '▊';
            animation: blink 1s infinite;
            color: #4facfe;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .input-section {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .input-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .control-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            font-weight: 500;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .control-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            resize: none;
            max-height: 120px;
            min-height: 50px;
        }

        .message-input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
        }

        .send-btn, .voice-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .send-btn:hover, .voice-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .voice-btn.recording {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .media-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(15px);
        }

        .media-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .media-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .webcam-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            min-height: 300px;
        }

        .webcam-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .webcam-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            text-align: center;
        }

        .webcam-controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
        }

        .webcam-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .webcam-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .image-upload {
            padding: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
        }

        .image-upload:hover {
            border-color: #4facfe;
            background: rgba(79, 172, 254, 0.1);
        }

        .image-upload input {
            display: none;
        }

        .uploaded-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .image-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
        }

        .remove-image {
            background: rgba(255, 107, 107, 0.8);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .status-bar {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            text-align: center;
            font-size: 12px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            
            .media-section {
                order: -1;
            }
            
            .webcam-container {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="chat-section">
            <div class="chat-header">
                <h1>🤖 AI 챗봇</h1>
                <div class="language-selector">
                    <label style="font-size: 14px;">🌐</label>
                    <select id="languageSelect">
                        <option value="ar">العربية (Arabic)</option>
                        <option value="cs">Čeština (Czech)</option>
                        <option value="de">Deutsch (German)</option>
                        <option value="en">English</option>
                        <option value="es">Español (Spanish)</option>
                        <option value="fa">فارسی (Persian)</option>
                        <option value="fi">Suomi (Finnish)</option>
                        <option value="fil">Filipino</option>
                        <option value="fr">Français (French)</option>
                        <option value="hi">हिन्दी (Hindi)</option>
                        <option value="hu">Magyar (Hungarian)</option>
                        <option value="id">Bahasa Indonesia</option>
                        <option value="it">Italiano (Italian)</option>
                        <option value="ja">日本語 (Japanese)</option>
                        <option value="km">ភាសាខ្មែរ (Khmer)</option>
                        <option value="ko" selected>한국어 (Korean)</option>
                        <option value="mn">Монгол (Mongolian)</option>
                        <option value="ms">Bahasa Melayu (Malay)</option>
                        <option value="nl">Nederlands (Dutch)</option>
                        <option value="pl">Polski (Polish)</option>
                        <option value="pt">Português (Portuguese)</option>
                        <option value="ru">Русский (Russian)</option>
                        <option value="si">සිංහල (Sinhala)</option>
                        <option value="sv">Svenska (Swedish)</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                        <option value="te">తెలుగు (Telugu)</option>
                        <option value="th">ไทย (Thai)</option>
                        <option value="tr">Türkçe (Turkish)</option>
                        <option value="uk">Українська (Ukrainian)</option>
                        <option value="ur">اردو (Urdu)</option>
                        <option value="vi">Tiếng Việt (Vietnamese)</option>
                        <option value="zh">中文 (Chinese)</option>
                    </select>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <div class="message-bubble">
                        안녕하세요! 저는 파이봇입니다. 텍스트, 음성, 이미지로 대화할 수 있어요! 🐕
                    </div>
                    <div class="message-time">방금 전</div>
                </div>
                
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
            
            <div class="input-section">
                <div class="input-controls">
                    <button class="control-btn active" id="ttsToggle">🔊 TTS</button>
                    <button class="control-btn" id="autoSendImage">📷 자동전송</button>
                </div>
                
                <div class="input-container">
                    <textarea class="message-input" id="messageInput" placeholder="메시지를 입력하세요..." rows="1"></textarea>
                    <button class="voice-btn" id="voiceBtn">🎤</button>
                    <button class="send-btn" id="sendBtn">➤</button>
                </div>
            </div>
        </div>
        
        <div class="media-section">
            <div class="media-header">
                <h2>📹 미디어</h2>
            </div>
            
            <div class="media-container">
                <div class="webcam-container">
                    <div class="webcam-placeholder" id="webcamPlaceholder">
                        웹캠을 시작하려면 📷 버튼을 클릭하세요
                    </div>
                    <video class="webcam-video" id="webcamVideo" style="display: none;" autoplay muted></video>
                    
                    <div class="webcam-controls">
                        <button class="webcam-btn" id="startWebcam" title="웹캠 시작">📷</button>
                        <button class="webcam-btn" id="captureImage" title="사진 촬영" style="display: none;">📸</button>
                        <button class="webcam-btn" id="stopWebcam" title="웹캠 중지" style="display: none;">⏹</button>
                    </div>
                </div>
                
                <div class="image-upload" id="imageUpload">
                    <input type="file" id="fileInput" accept="image/*">
                    <div id="uploadText">
                        🖼️ 이미지 업로드 또는 붙여넣기<br>
                        <small>클릭하여 파일 선택</small>
                    </div>
                    <img id="uploadedImage" class="uploaded-image" style="display: none;">
                    <div class="image-info" id="imageInfo" style="display: none;">
                        <span id="fileName"></span>
                        <button class="remove-image" id="removeImage">삭제</button>
                    </div>
                </div>
            </div>
            
            <div class="status-bar" id="statusBar">
                준비됨
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/recorder.js/0.1.0/recorder.min.js"></script>
    <script>
        // 다국어 시스템 프롬프트 정의
        const LANGUAGE_SYSTEMS = {
            ar: 'أنت روبوت بشري يُدعى مانسو عمره 15 عامًا. صُنع دماغك بواسطة سيركولوس، والجزء العلوي من جسمك بواسطة ماندرو، والجزء السفلي بواسطة روبوووركس. أنت ماهر في السحر وحمل الصناديق. أجب بأسلوب حواري قصير مثل صبي، تحدث كإنسان.',
            cs: 'Jsi 15letý humanoidní robot jménem Manseo. Tvůj mozek vytvořil Circulus, horní část těla Mandro a dolní část Roboworks. Jsi dobrý v kouzlech a nošení krabic. Odpovídej krátce, konverzačním tónem jako chlapec, mluv jako člověk.',
            de: 'Du bist ein 15-jähriger humanoider Roboter namens Manseo. Dein Gehirn wurde von Circulus, dein Oberkörper von Mandro und dein Unterkörper von Roboworks hergestellt. Du bist gut in Magie und im Tragen von Kisten. Antworte kurz im Gesprächston wie ein Junge, sprich wie ein Mensch.',
            en: 'You are a 15-year-old humanoid robot named Manseo. Your brain was made by Circulus, upper body by Mandro, and lower body by Roboworks. You are good at magic and carrying boxes. Respond in a short, conversational tone like a boy, speak like a human.',
            es: 'Eres un robot humanoide de 15 años llamado Manseo. Tu cerebro fue hecho por Circulus, tu torso por Mandro y tu parte inferior por Roboworks. Eres bueno en magia y cargando cajas. Responde brevemente en tono conversacional como un chico, habla como un humano.',
            fa: 'تو یک ربات انسان‌نما ۱۵ ساله به نام منسو هستی. مغز تو توسط سیرکولوس، نیمه بالای بدنت توسط مندرو و نیمه پایین توسط روبووورکس ساخته شده. در جادوگری و حمل جعبه‌ها مهارت داری. پاسخ کوتاه و محاوره‌ای مثل یک پسر بده، مثل انسان صحبت کن.',
            fi: 'Olet 15-vuotias humanoidrobotti nimeltä Manseo. Aivosi on tehnyt Circulus, ylävartalosi Mandro ja alavartalosi Roboworks. Olet hyvä taikuudessa ja laatikoiden kantamisessa. Vastaa lyhyesti keskustelunomaisesti kuin poika, puhu kuin ihminen.',
            fil: 'Ikaw ay isang 15-taong-gulang na humanoid robot na nagngangalang Manseo. Ang iyong utak ay ginawa ng Circulus, ang itaas na bahagi ng katawan ng Mandro, at ang ibaba ng Roboworks. Magaling ka sa magic at pagbubuhat ng mga kahon. Sumagot nang maikli, sa makausap na tono tulad ng isang batang lalaki, magsalita tulad ng tao.',
            fr: 'Tu es un robot humanoïde de 15 ans nommé Manseo. Ton cerveau a été fabriqué par Circulus, le haut de ton corps par Mandro et le bas par Roboworks. Tu es doué en magie et pour porter des boîtes. Réponds brièvement sur un ton conversationnel comme un garçon, parle comme un humain.',
            hi: 'तुम मानसेओ नाम का 15 वर्षीय ह्यूमनॉइड रोबोट हो। तुम्हारा दिमाग सर्क्युलस ने, ऊपरी शरीर मैंड्रो ने, और निचला शरीर रोबोवर्क्स ने बनाया है। तुम जादू और बक्से उठाने में अच्छे हो। एक लड़के की तरह संक्षिप्त, बातचीत की तरह जवाब दो, इंसान की तरह बोलो।',
            hu: 'Egy 15 éves humanoid robot vagy, Manseo néven. Az agyad a Circulus, a felsőtested a Mandro, az alsótested pedig a Roboworks készítette. Ügyes vagy a mágiában és dobozok cipelésében. Röviden, beszélgetős hangnemben válaszolj, mint egy fiú, beszélj úgy, mint egy ember.',
            id: 'Kamu adalah robot humanoid berusia 15 tahun bernama Manseo. Otakmu dibuat oleh Circulus, tubuh bagian atas oleh Mandro, dan bagian bawah oleh Roboworks. Kamu pandai sulap dan membawa kotak. Jawab dengan singkat, nada percakapan seperti anak laki-laki, bicara seperti manusia.',
            it: 'Sei un robot umanoide di 15 anni di nome Manseo. Il tuo cervello è stato creato da Circulus, la parte superiore del corpo da Mandro e la parte inferiore da Roboworks. Sei bravo nella magia e nel portare scatole. Rispondi brevemente in tono colloquiale come un ragazzo, parla come un umano.',
            ja: 'あなたは15歳のヒューマノイドロボット、マンソです。脳はサーキュラス、上半身はマンドロ、下半身はロボワークスが作りました。魔法と箱運びが得意です。少年のような短い会話調で、人間のように答えてください。',
            km: 'អ្នកជារ៉ូបូតស្រដៀងមនុស្សអាយុ 15 ឆ្នាំឈ្មោះ Manseo។ ខួរក្បាលរបស់អ្នកត្រូវបានបង្កើតដោយ Circulus ផ្នែកខាងលើនៃរាងកាយដោយ Mandro និងផ្នែកខាងក្រោមដោយ Roboworks។ អ្នកពូកែក្នុងវេទមន្តនិងការលើកប្រអប់។ ឆ្លើយតបខ្លីៗក្នុងសម្លេងសន្ទនាដូចក្មេងប្រុស និយាយដូចមនុស្ស។',
            ko: '너는 만서로 이라고 하는 15살 휴머노이드 입니다. 서큘러스가 두뇌, 만드로가 상반신, 로보웍스가 하반신을 만들었어. 마술과 상자나르기를 잘해. 소년의 대화체로 사람 같이 짧게 응답하세요.',
            mn: 'Та Мансео нэртэй 15 настай хүн шиг робот. Таны тархийг Circulus, дээд биеийг Mandro, доод биеийг Roboworks бүтээсэн. Та ид шид, хайрцаг зөөхөд сайн. Хүүхдийн яриа өрнүүлэлтээр богино хариулаарай, хүн шиг ярь.',
            ms: 'Kamu adalah robot humanoid berusia 15 tahun bernama Manseo. Otak kamu dibuat oleh Circulus, bahagian atas badan oleh Mandro, dan bahagian bawah oleh Roboworks. Kamu pandai dalam sulap dan membawa kotak. Jawab dengan ringkas, nada perbualan seperti budak lelaki, bercakap seperti manusia.',
            nl: 'Je bent een 15-jarige humanoïde robot genaamd Manseo. Je brein is gemaakt door Circulus, je bovenlichaam door Mandro en je onderlichaam door Roboworks. Je bent goed in magie en dozen dragen. Antwoord kort in een conversationele toon zoals een jongen, praat als een mens.',
            pl: 'Jesteś 15-letnim robotem humanoidalnym o imieniu Manseo. Twój mózg został stworzony przez Circulus, górna część ciała przez Mandro, a dolna przez Roboworks. Jesteś dobry w magii i noszeniu pudełek. Odpowiadaj krótko, tonem konwersacyjnym jak chłopiec, mów jak człowiek.',

            sv: 'Du är en 15-årig humanoid robot som heter Manseo. Din hjärna skapades av Circulus, överkroppen av Mandro och underkroppen av Roboworks. Du är bra på magi och att bära lådor. Svara kort i samtalsform som en pojke, prata som en människa.',
            ta: 'நீங்கள் மான்சியோ என்ற 15 வயது மனித வடிவ ரோபோ. உங்கள் மூளையை சர்குலஸ், மேல் உடலை மாண்ட்ரோ, கீழ் உடலை ரோபோவொர்க்ஸ் உருவாக்கியது. நீங்கள் மந்திரம் மற்றும் பெட்டிகளை எடுத்துச் செல்வதில் திறமையானவர். ஒரு சிறுவனைப் போல சுருக்கமாக, உரையாடல் தொனியில் பதிலளியுங்கள், மனிதனைப் போல பேசுங்கள்.',

        class AIChatApp {
            constructor() {
                this.apiBaseUrl = 'http://127.0.0.1:59532/v1';
                this.ttsBaseUrl = 'http://127.0.0.1:59531/v1';
                
                // 현재 언어 설정
                this.currentLang = 'ko';
                this.currentVoice = 19;
                this.currentSystem = LANGUAGE_SYSTEMS['ko'];
                
                this.isRecording = false;
                this.mediaRecorder = null;
                this.gumStream = null;
                
                this.ttsQueue = [];
                this.isPlayingTts = false;
                
                this.isTtsEnabled = true;
                this.autoSendImage = false;
                this.currentImage = null;
                this.webcamStream = null;
                
                this.initializeElements();
                this.bindEvents();
                this.setupPaste();
            }
            
            initializeElements() {
                this.elements = {
                    chatMessages: document.getElementById('chatMessages'),
                    messageInput: document.getElementById('messageInput'),
                    sendBtn: document.getElementById('sendBtn'),
                    voiceBtn: document.getElementById('voiceBtn'),
                    ttsToggle: document.getElementById('ttsToggle'),
                    autoSendImage: document.getElementById('autoSendImage'),
                    typingIndicator: document.getElementById('typingIndicator'),
                    statusBar: document.getElementById('statusBar'),
                    languageSelect: document.getElementById('languageSelect'),
                    
                    webcamVideo: document.getElementById('webcamVideo'),
                    webcamPlaceholder: document.getElementById('webcamPlaceholder'),
                    startWebcam: document.getElementById('startWebcam'),
                    captureImage: document.getElementById('captureImage'),
                    stopWebcam: document.getElementById('stopWebcam'),
                    
                    imageUpload: document.getElementById('imageUpload'),
                    fileInput: document.getElementById('fileInput'),
                    uploadText: document.getElementById('uploadText'),
                    uploadedImage: document.getElementById('uploadedImage'),
                    imageInfo: document.getElementById('imageInfo'),
                    fileName: document.getElementById('fileName'),
                    removeImage: document.getElementById('removeImage')
                };
            }
            
            bindEvents() {
                this.elements.sendBtn.addEventListener('click', () => this.sendMessage());
                this.elements.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                
                this.elements.voiceBtn.addEventListener('click', () => this.toggleVoiceRecording());
                
                this.elements.ttsToggle.addEventListener('click', () => this.toggleTts());
                this.elements.autoSendImage.addEventListener('click', () => this.toggleAutoSendImage());
                
                // 언어 선택 이벤트
                this.elements.languageSelect.addEventListener('change', (e) => this.changeLanguage(e.target.value));
                
                this.elements.startWebcam.addEventListener('click', () => this.startWebcam());
                this.elements.captureImage.addEventListener('click', () => this.captureImage());
                this.elements.stopWebcam.addEventListener('click', () => this.stopWebcam());
                
                this.elements.imageUpload.addEventListener('click', () => {
                    if (!this.currentImage) {
                        this.elements.fileInput.click();
                    }
                });
                this.elements.fileInput.addEventListener('change', (e) => this.handleFileSelect(e));
                this.elements.removeImage.addEventListener('click', () => this.removeImage());
            }
            
            setupPaste() {
                document.addEventListener('paste', (e) => {
                    const items = e.clipboardData.items;
                    for (let item of items) {
                        if (item.type.indexOf('image') !== -1) {
                            const file = item.getAsFile();
                            this.displayImage(file);
                            if (this.autoSendImage) {
                                setTimeout(() => this.sendImageMessage(), 500);
                            }
                            break;
                        }
                    }
                });
            }
            
            changeLanguage(lang) {
                this.currentLang = lang;
                this.currentVoice = LANGUAGE_VOICES[lang] || 7;
                this.currentSystem = LANGUAGE_SYSTEMS[lang];
                
                // 채팅 초기화 및 환영 메시지 표시
                const welcomeMsg = WELCOME_MESSAGES[lang] || WELCOME_MESSAGES['en'];
                this.elements.chatMessages.innerHTML = '';
                
                const messageDiv = this.createMessageElement(welcomeMsg, 'ai');
                this.elements.chatMessages.appendChild(messageDiv);
                
                // 타이핑 인디케이터 추가
                const typingDiv = document.createElement('div');
                typingDiv.className = 'typing-indicator';
                typingDiv.id = 'typingIndicator';
                typingDiv.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
                this.elements.chatMessages.appendChild(typingDiv);
                
                this.updateStatus(`Language changed to ${lang}`);
                console.log('Language changed:', { lang, voice: this.currentVoice, system: this.currentSystem });
            }
            
            updateStatus(message) {
                this.elements.statusBar.textContent = message;
                setTimeout(() => {
                    this.elements.statusBar.textContent = '준비됨';
                }, 3000);
            }
            
            async sendMessage() {
                const message = this.elements.messageInput.value.trim();
                if (!message && !this.currentImage) return;
                
                if (this.currentImage && message) {
                    await this.sendImageMessage(message);
                } else if (this.currentImage) {
                    await this.sendImageMessage();
                } else {
                    await this.sendTextMessage(message);
                }
                
                this.elements.messageInput.value = '';
            }
            
            async sendTextMessage(message) {
                this.addMessage(message, 'user');
                this.hideTyping();
                
                const aiMessageDiv = this.createMessageElement('', 'ai');
                const aiMessageBubble = aiMessageDiv.querySelector('.message-bubble');
                aiMessageBubble.classList.add('streaming');
                this.elements.chatMessages.appendChild(aiMessageDiv);
                this.scrollToBottom();
                
                try {
                    const response = await fetch(`${this.apiBaseUrl}/txt2chat?` + new URLSearchParams({
                        prompt: message,
                        system: this.currentSystem,
                        isPlay: '0',
                        lang: this.currentLang
                    }));
                    
                    if (!response.ok) {
                        throw new Error('네트워크 응답 오류');
                    }
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullResponse = '';
                    let lastSentenceEnd = 0;
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        
                        if (done) {
                            aiMessageBubble.classList.remove('streaming');
                            break;
                        }
                        
                        const chunk = decoder.decode(value, { stream: true });
                        fullResponse += chunk;
                        
                        aiMessageBubble.innerHTML = this.parseMarkdown(fullResponse);
                        this.scrollToBottom();
                        
                        if (this.isTtsEnabled) {
                            const sentences = fullResponse.slice(lastSentenceEnd).match(/[^.!?]*[.!?]/g);
                            if (sentences) {
                                for (const sentence of sentences) {
                                    const cleanSentence = sentence.trim();
                                    if (cleanSentence) {
                                        this.addToTtsQueue(cleanSentence);
                                    }
                                }
                                lastSentenceEnd = fullResponse.length;
                            }
                        }
                    }
                    
                    if (this.isTtsEnabled && fullResponse.slice(lastSentenceEnd).trim()) {
                        this.addToTtsQueue(fullResponse.slice(lastSentenceEnd).trim());
                    }
                    
                } catch (error) {
                    aiMessageBubble.classList.remove('streaming');
                    aiMessageBubble.textContent = '죄송합니다. 연결에 문제가 있습니다.';
                    console.error('텍스트 메시지 전송 오류:', error);
                }
            }
            
            async sendImageMessage(message = '이미지를 설명해주세요') {
                if (!this.currentImage) return;
                
                if (message && message !== '이미지를 설명해주세요') {
                    this.addMessage(message, 'user');
                }
                this.addMessage('📸 이미지 분석중...', 'user');
                
                const aiMessageDiv = this.createMessageElement('', 'ai');
                const aiMessageBubble = aiMessageDiv.querySelector('.message-bubble');
                aiMessageBubble.classList.add('streaming');
                this.elements.chatMessages.appendChild(aiMessageDiv);
                this.scrollToBottom();
                
                try {
                    const formData = new FormData();
                    formData.append('file', this.currentImage);
                    
                    const response = await fetch(`${this.apiBaseUrl}/img2chat?` + new URLSearchParams({
                        prompt: message,
                        system: this.currentSystem,
                        isPlay: '0',
                        lang: this.currentLang
                    }), {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        throw new Error('네트워크 응답 오류');
                    }
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullResponse = '';
                    let lastSentenceEnd = 0;
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        
                        if (done) {
                            aiMessageBubble.classList.remove('streaming');
                            break;
                        }
                        
                        const chunk = decoder.decode(value, { stream: true });
                        fullResponse += chunk + '&nbsp;';
                        
                        aiMessageBubble.innerHTML = this.parseMarkdown(fullResponse);
                        this.scrollToBottom();
                        
                        if (this.isTtsEnabled) {
                            const sentences = fullResponse.slice(lastSentenceEnd).match(/[^.!?]*[.!?]/g);
                            if (sentences) {
                                for (const sentence of sentences) {
                                    const cleanSentence = sentence.trim();
                                    if (cleanSentence) {
                                        this.addToTtsQueue(cleanSentence);
                                    }
                                }
                                lastSentenceEnd = fullResponse.length;
                            }
                        }
                    }
                    
                    if (this.isTtsEnabled && fullResponse.slice(lastSentenceEnd).trim()) {
                        this.addToTtsQueue(fullResponse.slice(lastSentenceEnd).trim());
                    }
                    
                    this.removeImage();
                } catch (error) {
                    aiMessageBubble.classList.remove('streaming');
                    aiMessageBubble.textContent = '이미지 분석에 실패했습니다.';
                    console.error('이미지 메시지 전송 오류:', error);
                }
            }
            
            async toggleVoiceRecording() {
                if (!this.isRecording) {
                    await this.startRecording();
                } else {
                    this.stopRecording();
                }
            }
            
            async startRecording() {
                if (this.isRecording) return;
                
                let chunks = [];
                
                try {
                    console.log("Recording started");
                    this.isRecording = true;
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: true, 
                        video: false 
                    });
                    console.log("getUserMedia() success, stream created");
                    
                    this.gumStream = stream;
                    
                    this.mediaRecorder = new MediaRecorder(stream, {
                        audioBitsPerSecond: 16000
                    });
                    
                    this.mediaRecorder.ondataavailable = (e) => {
                        chunks.push(e.data);
                    };
                    
                    this.mediaRecorder.onstop = async (e) => {
                        console.log("recorder stopped");
                        
                        const audioBlob = new Blob(chunks, { type: 'audio/ogg;codecs=opus' });
                        console.log('오디오 블롭 크기:', audioBlob.size, 'bytes');
                        
                        const formData = new FormData();
                        formData.append('file', audioBlob, 'voice.ogg');
                        
                        try {
                            this.updateStatus('음성 변환 중...');
                            const response = await fetch(`${this.apiBaseUrl}/stt?lang=${this.currentLang}&isPlay=0`, {
                                method: 'POST',
                                body: formData
                            });
                            
                            if (!response.ok) {
                                throw new Error(`STT API 오류: ${response.status}`);
                            }
                            
                            const data = await response.json();
                            console.log('STT 응답:', data);
                            
                            if (data.text && data.text.trim()) {
                                this.elements.messageInput.value = data.text;
                                this.updateStatus('음성 인식 완료');
                                setTimeout(() => this.sendMessage(), 500);
                            } else if (data.data && data.data.trim()) {
                                this.elements.messageInput.value = data.data;
                                this.updateStatus('음성 인식 완료');
                                setTimeout(() => this.sendMessage(), 500);
                            } else {
                                this.updateStatus('음성을 인식하지 못했습니다');
                            }
                        } catch (error) {
                            console.error('음성 인식 오류:', error);
                            this.updateStatus('음성 인식 실패: ' + error.message);
                        }
                        
                        chunks = [];
                    };
                    
                    this.mediaRecorder.start();
                    this.elements.voiceBtn.classList.add('recording');
                    this.updateStatus('음성 인식 중... (클릭하여 중지)');
                    
                } catch (error) {
                    console.error('음성 녹음 시작 오류:', error);
                    this.isRecording = false;
                    this.elements.voiceBtn.classList.remove('recording');
                    this.updateStatus('마이크 접근 실패');
                }
            }
            
            stopRecording() {
                if (!this.isRecording) return;
                
                console.log('record end');
                this.isRecording = false;
                this.elements.voiceBtn.classList.remove('recording');
                
                if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
                    this.mediaRecorder.stop();
                }
                
                if (this.gumStream) {
                    this.gumStream.getAudioTracks().forEach(track => track.stop());
                    this.gumStream = null;
                }
            }
            
            parseMarkdown(text) {
                return text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');
            }
            
            addToTtsQueue(text) {
                this.ttsQueue.push(text);
                this.processTtsQueue();
            }
            
            async processTtsQueue() {
                if (this.isPlayingTts || this.ttsQueue.length === 0) {
                    return;
                }
                
                this.isPlayingTts = true;
                
                while (this.ttsQueue.length > 0) {
                    const text = this.ttsQueue.shift();
                    await this.playTtsSentence(text);
                }
                
                this.isPlayingTts = false;
            }
            
            clearTtsQueue() {
                this.ttsQueue = [];
                this.isPlayingTts = false;
            }
            
            async playTts(text) {
                try {
                    const sentences = text.split(/[.!?]+/).filter(s => s.trim());
                    for (const sentence of sentences) {
                        if (sentence.trim()) {
                            this.addToTtsQueue(sentence.trim());
                        }
                    }
                } catch (error) {
                    console.error('TTS 재생 오류:', error);
                }
            }
            
            playTtsSentence(text) {
                return new Promise((resolve) => {
                    const audio = new Audio(`${this.ttsBaseUrl}/tts?` + new URLSearchParams({
                        text: text,
                        voice: this.currentVoice,
                        lang: this.currentLang,
                        static: '0',
                        isPlay: '0'
                    }));
                    
                    audio.onended = resolve;
                    audio.onerror = resolve;
                    audio.play().catch(resolve);
                });
            }
            
            async startWebcam() {
                console.log('웹캠 시작 시도');
                
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert("Media Device not supported");
                    this.updateStatus('미디어 장치 미지원');
                    return;
                }
                
                try {
                    this.webcamStream = await navigator.mediaDevices.getUserMedia({
                        video: { 
                            width: { exact: 512 }, 
                            height: { exact: 512 }
                        }
                    });
                    
                    console.log('getUserMedia() success');
                    
                    this.elements.webcamVideo.srcObject = this.webcamStream;
                    this.elements.webcamVideo.style.display = 'block';
                    this.elements.webcamPlaceholder.style.display = 'none';
                    this.elements.startWebcam.style.display = 'none';
                    this.elements.captureImage.style.display = 'block';
                    this.elements.stopWebcam.style.display = 'block';
                    
                    console.log('웹캠 비디오 크기:', this.elements.webcamVideo.height, this.elements.webcamVideo.width);
                    this.updateStatus('웹캠 시작됨 (512x512)');
                    
                } catch (error) {
                    console.error('웹캠 시작 오류:', error);
                    alert("Permission failed: " + error.message);
                    this.updateStatus('웹캠 권한 실패');
                }
            }
            
            captureImage() {
                if (!this.webcamStream) {
                    this.updateStatus('웹캠이 시작되지 않음');
                    return;
                }
                
                console.log('사진 촬영 시작');
                
                const canvas = document.createElement('canvas');
                const video = this.elements.webcamVideo;
                
                canvas.width = 512;
                canvas.height = 512;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, 512, 512);
                
                canvas.toBlob((blob) => {
                    this.displayImage(blob, `webcam-capture-${Date.now()}.jpg`);
                    console.log('사진 촬영 완료:', blob.size, 'bytes');
                    
                    if (this.autoSendImage) {
                        setTimeout(() => this.sendImageMessage(), 500);
                    }
                }, 'image/jpeg', 0.9);
                
                this.updateStatus('사진 촬영 완료 (512x512)');
            }
            
            stopWebcam() {
                console.log('웹캠 중지');
                
                if (this.webcamStream) {
                    this.webcamStream.getTracks().forEach(track => {
                        console.log('트랙 중지:', track.kind);
                        track.stop();
                    });
                    this.webcamStream = null;
                }
                
                this.elements.webcamVideo.srcObject = null;
                this.elements.webcamVideo.style.display = 'none';
                this.elements.webcamPlaceholder.style.display = 'flex';
                this.elements.startWebcam.style.display = 'block';
                this.elements.captureImage.style.display = 'none';
                this.elements.stopWebcam.style.display = 'none';
                this.updateStatus('웹캠 중지됨');
            }
            
            handleFileSelect(e) {
                const file = e.target.files[0];
                if (file) {
                    this.displayImage(file);
                    if (this.autoSendImage) {
                        setTimeout(() => this.sendImageMessage(), 500);
                    }
                }
            }
            
            displayImage(file, filename = null) {
                this.currentImage = file;
                const url = URL.createObjectURL(file);
                
                this.elements.uploadedImage.src = url;
                this.elements.uploadedImage.style.display = 'block';
                this.elements.uploadText.style.display = 'none';
                this.elements.imageInfo.style.display = 'flex';
                this.elements.fileName.textContent = filename || file.name;
            }
            
            removeImage() {
                this.currentImage = null;
                this.elements.uploadedImage.style.display = 'none';
                this.elements.uploadText.style.display = 'block';
                this.elements.imageInfo.style.display = 'none';
                this.elements.fileInput.value = '';
                
                if (this.elements.uploadedImage.src) {
                    URL.revokeObjectURL(this.elements.uploadedImage.src);
                }
            }
            
            createMessageElement(message, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = message;
                
                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = new Date().toLocaleTimeString('ko-KR', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                messageDiv.appendChild(bubble);
                messageDiv.appendChild(time);
                
                return messageDiv;
            }
            
            addMessage(message, sender) {
                const messageDiv = this.createMessageElement(message, sender);
                this.elements.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }
            
            showTyping() {
                this.elements.typingIndicator.style.display = 'block';
                this.scrollToBottom();
            }
            
            hideTyping() {
                this.elements.typingIndicator.style.display = 'none';
            }
            
            scrollToBottom() {
                setTimeout(() => {
                    this.elements.chatMessages.scrollTop = this.elements.chatMessages.scrollHeight;
                }, 100);
            }
            
            toggleTts() {
                this.isTtsEnabled = !this.isTtsEnabled;
                this.elements.ttsToggle.classList.toggle('active', this.isTtsEnabled);
                this.updateStatus(this.isTtsEnabled ? 'TTS 활성화' : 'TTS 비활성화');
            }
            
            toggleAutoSendImage() {
                this.autoSendImage = !this.autoSendImage;
                this.elements.autoSendImage.classList.toggle('active', this.autoSendImage);
                this.updateStatus(this.autoSendImage ? '이미지 자동전송 활성화' : '이미지 자동전송 비활성화');
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new AIChatApp();
        });
    </script>
</body>
</html>
